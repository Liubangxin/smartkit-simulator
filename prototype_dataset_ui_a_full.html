<body>
<main id="root"></main>
<div id="modalRoot"></div>
<script>
const datasets=[];
const routes=[];
const commands=[];
const state={page:'workbench',worktab:'overview',runtimeTab:'overview',tab:'rest',selected:'',active:'',activeRev:0,datasetDir:'',demo:'idle',execution:'',dirty:false,editing:false,server:{ssh:false,rest:false},selectedItem:0,datasetPage:1,datasetPageSize:8,managerPage:1,casePage:1,casePageSize:8,modal:null,modalData:null,logs:[]};
function ds(id=state.selected){return datasets.find(x=>x.id===id)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function runtime(){return ds(state.active)}
function viewDataset(){return state.page==='workbench'?ds():runtime()}
function isMismatch(){return state.selected!==state.active||ds().rev!==state.activeRev}
function optionList(){return datasets.filter(x=>!x.archived).map(x=>`<option value="${x.id}" ${x.id===state.selected?'selected':''}>${esc(x.name)}</option>`).join('')}
function appHeader(){return `<header class="app-header"><div class="brand">SmartKit Simulator</div><nav class="app-nav"><button class="${state.page==='workbench'?'active':''}" onclick="setPage('workbench')">数据集工作台</button><button class="${state.page==='runtime'?'active':''}" onclick="setPage('runtime')">模拟器运行</button></nav><span class="grow"></span><span class="badge dot ${state.server.ssh?'success':'danger'}">SSH ${state.server.ssh?'运行中':'已停止'}</span><span class="badge dot ${state.server.rest?'success':'danger'}">REST ${state.server.rest?'运行中':'已停止'}</span><button class="btn" onclick="openSettings()">全局设置</button></header>`}
function datasetSidebar(){const all=datasets.filter(x=>!x.archived),pages=Math.ceil(all.length/state.datasetPageSize),start=(state.datasetPage-1)*state.datasetPageSize,list=all.slice(start,start+state.datasetPageSize);return `<aside class="dataset-sidebar"><div class="dataset-sidebar-head"><div style="display:flex;align-items:center;gap:8px"><strong>模拟数据集</strong><span class="badge neutral">${all.length.toLocaleString()} 个文件</span><span class="grow"></span><button class="btn icon-btn primary" onclick="openCreate(false)" title="新增数据集">＋</button></div><div style="margin-top:9px"><input class="search-sm" placeholder="搜索名称、文件名或标签"></div></div><div class="dataset-list">${list.map(d=>`<div class="dataset-entry ${d.id===state.selected?'active':''}" onclick="selectDataset('${d.id}')"><strong>${esc(d.name)}</strong><small class="mono">${esc(d.id)}.json</small><small>Rev.${d.rev} · ${d.ssh} SSH / ${d.rest} REST</small></div>`).join('')}</div><div class="pager"><span>${start+1}-${Math.min(start+state.datasetPageSize,all.length)} / ${all.length.toLocaleString()}</span><span class="grow"></span><button class="btn" onclick="changeDatasetPage(-1)" ${state.datasetPage===1?'disabled':''}>‹</button><span>${state.datasetPage}/${pages}</span><button class="btn" onclick="changeDatasetPage(1)" ${state.datasetPage===pages?'disabled':''}>›</button></div><div class="panel-actions"><button class="btn" onclick="openDatasetManager()">全部管理</button><button class="btn" onclick="openImport()">导入文件</button></div></aside>`}
function workbenchOverview(){const d=ds();return `<div class="overview"><div class="summary-grid"><div class="summary-card"><strong>${d.ssh}</strong><span>SSH 命令</span></div><div class="summary-card"><strong>${d.rest}</strong><span>REST 路由</span></div><div class="summary-card"><strong>${d.rev}</strong><span>文件修订号</span></div><div class="summary-card"><strong>${d.tags.length}</strong><span>场景标签</span></div></div><div class="overview-grid"><section class="overview-panel"><h3>快速维护</h3><div class="quick-row"><button class="btn primary" onclick="setWorktab('ssh')">＋ 新增 SSH 命令</button><button class="btn primary" onclick="setWorktab('rest')">＋ 新增 REST 路由</button><button class="btn" onclick="openImport()">导入文件</button></div></section><section class="overview-panel"><h3>数据集文件</h3><div class="muted" style="font-size:11px;line-height:1.7">文件：<span class="mono">${esc(d.id)}.json</span><br>标签：${d.tags.map(esc).join('、')}<br>最近保存：${esc(d.updated)}</div></section></div><div class="hint ${isMismatch()?'warning-hint':''}" style="margin-top:12px">${isMismatch()?`运行中的快照来自 ${esc(runtime().id)}.json Rev.${state.activeRev}；工作台内保存文件不会影响正在执行的用例。`:'当前文件修订号与运行快照一致。'}</div></div>`}
function workbenchBindings(){const total=126,pages=Math.ceil(total/state.casePageSize),start=(state.casePage-1)*state.casePageSize,rows=Array.from({length:Math.min(state.casePageSize,total-start)},(_,i)=>{const n=start+i+1;return {id:`TC-${String(4100+n).padStart(5,'0')}`,name:`设备告警处理用例 ${n}`,module:n%3===0?'巡检':n%3===1?'告警管理':'设备接入',last:n%5===0?'失败':'通过'}});return `<div class="binding-page"><div class="binding-summary"><strong>${esc(ds().name)}</strong> 当前关联 <b>${total}</b> 个用例；绑定目标文件为 <span class="mono">${esc(ds().id)}.json</span>。多个用例可以复用此文件。</div><div class="binding-toolbar"><input placeholder="搜索用例 ID、名称或模块"><select class="btn"><option>全部模块</option><option>告警管理</option><option>设备接入</option></select><span class="grow"></span><button class="btn" onclick="toast('请选择 CSV 绑定关系文件')">批量导入关系</button><button class="btn primary" onclick="openBindCases()">＋ 关联用例</button></div><table class="table"><thead><tr><th>用例 ID</th><th>用例名称</th><th>模块</th><th>数据集文件</th><th>最近执行</th><th>操作</th></tr></thead><tbody>${rows.map(c=>`<tr><td class="case-id">${c.id}</td><td>${c.name}</td><td>${c.module}</td><td><span class="badge info mono">${esc(ds().id)}.json</span></td><td><span class="badge ${c.last==='通过'?'success':'danger'}">${c.last}</span></td><td><div class="table-actions"><button class="btn" onclick="toast('打开用例详情')">查看</button><button class="btn danger" onclick="toast('已解除用例绑定（原型）')">解除</button></div></td></tr>`).join('')}</tbody></table><div class="pager"><span>${start+1}-${Math.min(start+state.casePageSize,total)} / ${total}</span><span class="grow"></span><select onchange="changeCasePageSize(this.value)"><option value="8">8 条/页</option><option value="20">20 条/页</option><option value="50">50 条/页</option></select><button class="btn" onclick="changeCasePage(-1)" ${state.casePage===1?'disabled':''}>‹</button><span>${state.casePage}/${pages}</span><button class="btn" onclick="changeCasePage(1)" ${state.casePage===pages?'disabled':''}>›</button></div></div>`}
function workbenchFileInfo(){const d=ds(),body=`{\n  "schema_version": 1,\n  "id": "${d.id}",\n  "name": "${d.name}",\n  "revision": ${d.rev},\n  "ssh": { "commands": [ ... ] },\n  "rest": { "routes": [ ... ] }\n}`;return `<div class="file-panel"><div class="file-layout"><section class="file-card"><h3>数据集文件</h3><table class="table"><tr><th>文件名</th><td class="mono">${esc(d.id)}.json</td></tr><tr><th>完整路径</th><td class="mono">${esc(state.datasetDir)}\\${esc(d.id)}.json</td></tr><tr><th>文件大小</th><td>18.6 KB</td></tr><tr><th>最近修改</th><td>${esc(d.updated)}</td></tr><tr><th>校验状态</th><td><span class="badge success">格式有效</span></td></tr></table><div class="quick-row" style="margin-top:12px"><button class="btn">打开文件位置</button><button class="btn">导出文件</button><button class="btn">重新加载</button></div></section><section class="file-card"><h3>文件预览</h3><pre class="file-preview">${esc(body)}</pre></section></div><div class="file-rule" style="margin-top:12px"><b>一数据集一文件：</b>此文件完整包含 SSH 命令和 REST 路由。保存时通过临时文件原子替换，不拆分为多个版本文件。</div></div>`}
function renderWorkbench(){const d=ds();state.tab=state.worktab==='ssh'?'ssh':'rest';return `<div class="app">${appHeader()}<div class="directory-bar"><strong>数据集目录</strong><span class="directory-path mono">${esc(state.datasetDir)}</span><span class="badge success">可读写</span><span class="muted">已扫描 ${datasets.filter(x=>!x.archived).length.toLocaleString()} 个 JSON 文件</span><span class="grow"></span><button class="btn" onclick="toast('目录扫描完成，索引已刷新')">重新扫描</button><button class="btn" onclick="openDirectory()">更改目录</button></div><div class="workbench">${datasetSidebar()}<section class="workbench-main"><div class="workbench-head"><div><h2>${esc(d.name)} <span class="badge ${state.dirty?'warn':'neutral'}">Rev.${d.rev}${state.dirty?' · 未保存':''}</span></h2><p><span class="mono">${esc(d.id)}.json</span> · ${esc(d.description)}</p></div><span class="grow"></span><button class="btn" onclick="openCreate(true)">复制为新文件</button><button class="btn" onclick="setWorktab('file')">文件信息</button><button class="btn primary" onclick="openActivate()" ${state.dirty?'disabled':''}>激活当前文件</button></div><nav class="subtabs"><button class="subtab ${state.worktab==='overview'?'active':''}" onclick="setWorktab('overview')">概览</button><button class="subtab ${state.worktab==='ssh'?'active':''}" onclick="setWorktab('ssh')">SSH 命令</button><button class="subtab ${state.worktab==='rest'?'active':''}" onclick="setWorktab('rest')">REST 路由</button><button class="subtab ${state.worktab==='bindings'?'active':''}" onclick="setWorktab('bindings')">关联用例 <span class="badge info">126</span></button><button class="subtab ${state.worktab==='file'?'active':''}" onclick="setWorktab('file')">文件信息</button></nav>${state.worktab==='overview'?workbenchOverview():state.worktab==='bindings'?workbenchBindings():state.worktab==='file'?workbenchFileInfo():editor()}</section></div></div>`}
function runtimeOverview(){const r=runtime();return `<div class="runtime-overview"><section class="runtime-card"><h3>当前执行快照</h3><div class="confirm-box"><strong>${esc(r.name)} Rev.${state.activeRev}</strong><span class="mono muted">来源：${esc(r.id)}.json · ${esc(state.execution||'manual-activation')}</span></div><div class="protocol-grid"><div class="protocol-card"><strong>SSH 模拟服务</strong><p>0.0.0.0:22<br>${r.ssh} 个命令 · 认证来自全局设置</p><button class="btn" onclick="setRuntimeTab('ssh')">查看 SSH</button></div><div class="protocol-card"><strong>REST HTTPS 模拟服务</strong><p>0.0.0.0:443<br>${r.rest} 条路由 · TLS 1.2/1.3</p><button class="btn" onclick="setRuntimeTab('rest')">查看 REST</button></div></div></section><section class="runtime-card"><h3>本次用例绑定</h3><table class="table"><tr><th>用例</th><td class="case-id">TC-04123</td></tr><tr><th>数据集文件</th><td class="mono">${esc(r.id)}.json</td></tr><tr><th>加载修订号</th><td>Rev.${state.activeRev}</td></tr><tr><th>激活时间</th><td>12:00:31</td></tr></table><div class="hint">绑定关系在数据集工作台维护，运行页只展示本次加载结果。</div></section></div>`}
function renderSimulator(){const r=runtime(),running=state.demo!=='idle';if(state.runtimeTab==='ssh'||state.runtimeTab==='rest')state.tab=state.runtimeTab;return `<div class="app">${appHeader()}<div class="runtime-page-head">${running?`<span class="badge dot ${state.demo==='busy'?'info':'success'}">${state.demo==='busy'?'执行器占用':'手工激活'}</span><strong>运行快照：${esc(r.name)} Rev.${state.activeRev}</strong>${state.demo==='busy'?`<span class="runtime-sep">│</span><span class="mono">${esc(state.execution)}</span>`:''}`:'<span class="badge neutral">无活动快照</span>'}<span class="grow"></span><button class="btn" onclick="setPage('workbench')">前往数据集工作台</button></div><nav class="tabs"><button class="tab ${state.runtimeTab==='overview'?'active':''}" onclick="setRuntimeTab('overview')">运行概览</button><button class="tab ${state.runtimeTab==='ssh'?'active':''}" onclick="setRuntimeTab('ssh')">SSH</button><button class="tab ${state.runtimeTab==='rest'?'active':''}" onclick="setRuntimeTab('rest')">REST</button></nav>${state.runtimeTab==='overview'?runtimeOverview()+logPanel():serverStrip()+editor()+logPanel()}</div>`}
function render(){document.getElementById('root').innerHTML=state.page==='workbench'?renderWorkbench():renderSimulator();const demo=document.getElementById('demoState');if(demo)demo.value=state.demo;renderModal()}
function serverStrip(){const isRest=state.tab==='rest',key=isRest?'rest':'ssh',on=state.server[key];return `<div class="server-strip"><strong>${isRest?'REST HTTPS Server':'SSH Server'}</strong><span class="endpoint mono">${isRest?'0.0.0.0:443':'0.0.0.0:22'}</span><span class="badge dot ${on?'success':'danger'}">${on?'运行中':'已停止'}</span><button class="btn ${on?'danger':'success'}" onclick="toggleServer('${key}')">${on?'停止服务':'启动服务'}</button><span class="grow"></span>${!isRest?`<span class="muted">认证来自全局设置</span>`:''}<button class="btn" onclick="openSettings()">全局设置</button></div>`}
function editor(){const rest=state.tab==='rest',items=rest?routes:commands,v=viewDataset(),maintaining=state.page==='workbench';return `<div class="content"><aside class="list-panel"><div class="panel-title"><span>${rest?'REST 路由':'SSH 命令'}</span><span class="grow"></span><span class="muted">${rest?v.rest:v.ssh}</span></div><div class="list-search"><input class="search-sm" placeholder="搜索${rest?'路由':'命令'}"></div><div class="list"><div class="group"><span>${rest?'REDFISH':'SYSTEM'}</span><span class="grow"></span><span>⌄</span></div>${items.map((x,i)=>`<div class="item ${state.selectedItem===i?'active':''}" onclick="selectItem(${i})">${rest?`<span class="method">${x[0]}</span>${esc(x[1])}`:esc(x)}</div>`).join('')}</div>${maintaining?`<div class="panel-actions"><button class="btn" onclick="newEntry()">＋ 新增</button><button class="btn">${rest?'导入':'移动'}</button><button class="btn">删除</button></div>`:''}</aside><section class="editor"><div class="editor-head"><h3>${rest?'REST 路由':'SSH 命令'}${maintaining?'编辑器':'运行快照'}</h3>${maintaining?`<span class="badge ${state.dirty?'warn':'neutral'}">${state.dirty?'未保存':'已保存'}</span>`:'<span class="badge info">只读</span>'}<span class="grow"></span><span class="muted mono" style="font-size:10px">${esc(v.id)}@${maintaining?v.rev:state.activeRev}</span></div>${rest?restForm():sshForm()}</section></div>`}
function disabled(){return state.page==='workbench'&&state.editing?'':'disabled'}
function restForm(){const item=routes[state.selectedItem]||routes[0];return `<div class="form-grid"><label class="field">HTTP 方法<select ${disabled()}><option>${item[0]}</option></select></label><label class="field">URI<input ${disabled()} value="${esc(item[1])}"></label><label class="field">状态码<input ${disabled()} value="200"></label><label class="field full">响应头<input ${disabled()} value="Content-Type: application/json"></label><label class="field full">响应体<textarea ${disabled()} oninput="markDirty()">{\n  "CriticalAlarmCount": 1,\n  "MajorAlarmCount": 3,\n  "Health": "Warning"\n}</textarea></label></div><div class="hint ${state.page==='workbench'&&isMismatch()?'warning-hint':''}">${state.page!=='workbench'?'这里展示当前执行快照；如需修改，请前往数据集工作台。':isMismatch()?'正在运行的是 '+esc(runtime().name)+' Rev.'+state.activeRev+'；保存不会改变运行快照。':'保存会创建新版本，当前执行快照仍保持不变。'}</div>${editActions('REST 路由')}`}
function sshForm(){const item=commands[state.selectedItem]||commands[0];return `<div class="form-grid"><label class="field full">命令名称<input ${disabled()} value="${esc(item)}"></label><label class="field full">输出<textarea ${disabled()} oninput="markDirty()">Critical alarm detected\nAlarm ID: 0xA031\nSeverity: Critical</textarea></label></div><div class="hint ${isMismatch()?'warning-hint':''}">SSH 认证来自全局设置，数据集只保存命令响应。</div>${editActions('SSH 命令')}`}
function editActions(label){if(state.page!=='workbench')return `<div class="editor-actions">${state.tab==='rest'?'<button class="btn">测试当前路由</button>':'<button class="btn">复制 SSH 测试命令</button>'}<button class="btn" onclick="setPage('workbench')">前往工作台维护</button></div>`;return `<div class="editor-actions"><button class="btn" onclick="toggleEdit()">${state.editing?'取消编辑':'编辑'}</button><button class="btn primary" onclick="saveRevision()" ${state.dirty?'':'disabled'}>保存数据集文件</button>${state.tab==='rest'?'<button class="btn">测试路由</button>':''}</div>`}
function logPanel(){return `<div class="layout-resizer horizontal" role="separator" aria-orientation="horizontal" tabindex="0" title="拖动调整上下高度；双击恢复默认" onpointerdown="startLayoutResize(event,'horizontal')" ondblclick="resetLayoutSize('horizontal')"></div><div class="logbar"><strong>运行日志</strong><span class="badge neutral">${esc(runtime()?.id||'no-snapshot')}@${state.activeRev||'-'}</span><span class="grow"></span><button class="btn ghost" style="color:#d6e0e8">清空</button></div><div class="log"><span class="dim">日志自动带入数据集版本和执行标识</span>\n${state.logs.map(esc).join('\n')}\n<span class="state-dump">UI state: selected=${esc(state.selected)}@${ds().rev}, active=${esc(state.active)}@${state.activeRev}, mode=${state.demo}, dirty=${state.dirty}</span></div>`}
function selectDataset(id){if(state.dirty&&!confirm('当前有未保存内容，确定放弃并切换数据集？')){render();return}state.selected=id;state.dirty=false;state.editing=false;state.selectedItem=0;render()}
function setPage(page){state.page=page;state.selectedItem=0;state.editing=false;state.dirty=false;render()}
function setRuntimeTab(tab){state.runtimeTab=tab;if(tab==='ssh'||tab==='rest')state.tab=tab;state.selectedItem=0;render()}
function setWorktab(tab){state.worktab=tab;if(tab==='ssh'||tab==='rest')state.tab=tab;state.selectedItem=0;state.editing=false;state.dirty=false;render()}
function setTab(tab){state.tab=tab;state.selectedItem=0;state.editing=false;state.dirty=false;render()}
function selectItem(i){state.selectedItem=i;state.editing=false;state.dirty=false;render()}
function changeDatasetPage(delta){const total=Math.ceil(datasets.filter(x=>!x.archived).length/state.datasetPageSize);state.datasetPage=Math.max(1,Math.min(total,state.datasetPage+delta));render()}
function changeManagerPage(delta){const total=Math.ceil(datasets.filter(x=>state.modalData.showArchived||!x.archived).length/10);state.managerPage=Math.max(1,Math.min(total,state.managerPage+delta));renderModal()}
function changeCasePage(delta){const total=Math.ceil(126/state.casePageSize);state.casePage=Math.max(1,Math.min(total,state.casePage+delta));render()}
function changeCasePageSize(size){state.casePageSize=Number(size);state.casePage=1;render()}
function newEntry(){if(state.tab==='rest'){routes.unshift(['GET','/new-route']);ds().rest++}else{commands.unshift('new command');ds().ssh++}state.selectedItem=0;state.editing=true;state.dirty=true;render();toast(`已新增${state.tab==='rest'?' REST 路由':' SSH 命令'}草稿`)}
function toggleEdit(){state.editing=!state.editing;if(!state.editing)state.dirty=false;render()}
function markDirty(){state.dirty=true;const badge=document.querySelector('.editor-head .badge');if(badge){badge.className='badge warn';badge.textContent='未保存'}const save=document.querySelector('.editor-actions .primary');if(save)save.disabled=false}
function saveRevision(){const d=ds();d.rev++;d.updated='刚刚';state.logs.push(`[管理][${d.id}@${d.rev}] 已原子保存 ${d.id}.json`);state.dirty=false;state.editing=false;render();toast(`已保存 ${d.id}.json · Rev.${d.rev}`)}
function toggleServer(key){state.server[key]=!state.server[key];state.logs.push(`[管理] ${key.toUpperCase()} 服务${state.server[key]?'已启动':'已停止'}`);render()}
function setDemoState(v){state.demo=v;if(v==='idle'){state.execution=''}else if(v==='busy'){state.execution='suite-10086-case-023-attempt-1'}render()}
function openDatasetManager(){state.managerPage=1;state.modal='datasets';state.modalData={showArchived:false};renderModal()}
function openSettings(){state.modal='settings';state.modalData={};renderModal()}
function openActivate(){state.modal='activate';state.modalData={};renderModal()}
function openCreate(copy=false){state.modal='create';state.modalData={copy};renderModal()}
function openImport(){state.modal='import';state.modalData={};renderModal()}
function openBindCases(){state.modal='bindCases';state.modalData={};renderModal()}
function openDirectory(){state.modal='directory';state.modalData={};renderModal()}
function closeModal(){state.modal=null;state.modalData=null;renderModal()}
function modalFrame(title,body,foot='',small=false){return `<div class="modal" onclick="if(event.target===this)closeModal()"><section class="modal-card ${small?'small':''}"><header class="modal-head"><h3>${title}</h3><span class="grow"></span><button class="btn icon-btn ghost" onclick="closeModal()">✕</button></header><div class="modal-body">${body}</div>${foot?`<footer class="modal-foot">${foot}</footer>`:''}</section></div>`}
function renderModal(){const root=document.getElementById('modalRoot');if(!state.modal){root.innerHTML='';return}if(state.modal==='datasets')root.innerHTML=datasetManager();if(state.modal==='settings')root.innerHTML=settingsModal();if(state.modal==='activate')root.innerHTML=activateModal();if(state.modal==='create')root.innerHTML=createModal();if(state.modal==='import')root.innerHTML=importModal();if(state.modal==='bindCases')root.innerHTML=bindCasesModal();if(state.modal==='directory')root.innerHTML=directoryModal()}

ick="saveSettings()">保存设置</button>`)}
function activateModal(){const d=ds();if(state.demo==='busy')return modalFrame('无法激活数据集',`<div class="conflict"><strong>模拟器正由用例执行器占用</strong><br>执行标识：<span class="mono">${esc(state.execution)}</span><br>运行数据：${esc(runtime().name)} Rev.${state.activeRev}<br><br>请等待用例结束后重试。普通用户不能强制覆盖执行快照。</div>`,`<button class="btn" onclick="closeModal()">知道了</button>`,true);return modalFrame('激活模拟数据集文件',`<div class="confirm-box"><strong>${esc(d.name)} Rev.${d.rev}</strong><span class="mono muted">${esc(state.datasetDir)}\\${esc(d.id)}.json</span></div><p class="muted" style="font-size:12px;line-height:1.6">模拟器将读取并校验整个文件，然后复制为不可变执行快照。后续保存文件不会影响本次快照。</p>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="activateSelected()">读取并激活</button>`,true)}

function createDataset(copy){const name=document.getElementById('newName').value.trim(),id=document.getElementById('newId').value.trim();if(!name||!id){toast('名称和 ID 不能为空');return}if(datasets.some(x=>x.id===id)){toast('ID 已存在');return}const base=copy?ds():null;datasets.push({id,name,description:document.getElementById('newDesc').value||'尚未填写描述。',tags:[],rev:1,ssh:base?.ssh||0,rest:base?.rest||0,updated:'刚刚',archived:false,revisions:[{n:1,note:copy?`从 ${base.name} Rev.${base.rev} 复制`:'创建空数据集',time:'刚刚'}]});state.selected=id;closeModal();render();toast(`已创建 ${name}`)}

function toast(message){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;z-index:120;left:50%;top:18px;transform:translateX(-50%);padding:9px 15px;border-radius:7px;background:#26313d;color:#fff;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.25)';document.body.appendChild(t)}t.textContent=message;t.classList.remove('hidden');clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.add('hidden'),2200)}

/* Production adapter: keep the approved prototype layout and drive it from real APIs. */
const live={details:new Map(),datasetTotal:0,datasetPages:1,bindings:[],bindingTotal:0,bindingPages:1,cases:[],caseTotal:0,casePages:1,runtime:null,settings:null};
async function api(path,options={}){const response=await fetch(path,options);let result={};try{result=await response.json()}catch(_error){}if(!response.ok)throw new Error(result.message||`请求失败 (${response.status})`);return result}
function datasetMeta(item){return{id:item.id,name:item.name||item.id,description:item.description||'',tags:item.tags||[],rev:item.revision||1,ssh:item.command_count??item.commands?.length??0,rest:item.route_count??item.rest_routes?.length??0,updated:item.modified_at?new Date(item.modified_at*1000).toLocaleString():'刚刚',archived:false,revisions:[]}}
function currentDetail(){return live.details.get(state.page==='workbench'?state.selected:state.active)||null}
function syncEditorData(detail){routes.splice(0,routes.length,...(detail?.rest_routes||[]).map(x=>[x.method||'GET',x.uri||'/']));commands.splice(0,commands.length,...(detail?.commands||[]).map(x=>x.name||''))}
function groupContext(){const detail=currentDetail()||{};return state.tab==='rest'?{items:detail.rest_routes||[],groups:detail.rest_groups||(detail.rest_groups=[])}:{items:detail.commands||[],groups:detail.command_groups||(detail.command_groups=[])}}
function normalizedGroup(item){return String(item?.group||'').trim()||'Ungrouped'}
function allGroupNames(context=groupContext()){const names=[];[...(context.groups||[]),...context.items.map(item=>normalizedGroup(item))].forEach(name=>{name=String(name||'').trim();if(name&&name!=='Ungrouped'&&!names.includes(name))names.push(name)});return [...names,'Ungrouped']}
function selectGroup(name){state.selectedGroup=name;render()}
function createGroup(){const context=groupContext(),name=prompt('请输入新增分组名称：','');if(!name?.trim())return;const value=name.trim();if(value==='Ungrouped'||allGroupNames(context).some(group=>group.toLowerCase()===value.toLowerCase()))return toast('分组名称已存在');context.groups.push(value);state.selectedGroup=value;state.dirty=true;render()}
function renameGroup(){const context=groupContext(),oldName=state.selectedGroup;if(!oldName||oldName==='Ungrouped')return toast('请先选择要重命名的分组');const name=prompt('请输入新的分组名称：',oldName);if(!name?.trim()||name.trim()===oldName)return;const value=name.trim();if(allGroupNames(context).some(group=>group!==oldName&&group.toLowerCase()===value.toLowerCase()))return toast('分组名称已存在');const index=context.groups.indexOf(oldName);if(index>=0)context.groups[index]=value;context.items.forEach(item=>{if(normalizedGroup(item)===oldName)item.group=value});state.selectedGroup=value;state.dirty=true;render()}
function deleteGroup(){const context=groupContext(),name=state.selectedGroup;if(!name||name==='Ungrouped')return toast('请先选择要删除的分组');if(!confirm(`删除分组“${name}”？组内条目将移到 Ungrouped。`))return;context.groups.splice(context.groups.indexOf(name),1);context.items.forEach(item=>{if(normalizedGroup(item)===name)item.group=''});state.selectedGroup='Ungrouped';state.dirty=true;render()}
function moveEntry(){const context=groupContext(),item=context.items[state.selectedItem];if(!item)return;const target=prompt(`移动到分组：\n${allGroupNames(context).join('、')}`,normalizedGroup(item));if(!target?.trim())return;const value=target.trim();if(!allGroupNames(context).includes(value))return toast('目标分组不存在');item.group=value==='Ungrouped'?'':value;state.selectedGroup=value;state.dirty=true;render()}
async function loadDataset(id){if(!id)return null;const detail=await api('/api/datasets/'+encodeURIComponent(id));live.details.set(id,detail);const meta=datasetMeta(detail),index=datasets.findIndex(x=>x.id===id);if(index>=0)datasets[index]=meta;else datasets.push(meta);if(id===(state.page==='workbench'?state.selected:state.active))syncEditorData(detail);return detail}
async function loadDatasetPage(){const keyword=state.datasetKeyword||'';const result=await api(`/api/datasets?page=${state.datasetPage}&page_size=${state.datasetPageSize}&keyword=${encodeURIComponent(keyword)}`);live.datasetTotal=result.total;live.datasetPages=Math.max(1,Math.ceil(result.total/result.page_size));datasets.splice(0,datasets.length,...result.items.map(datasetMeta));if(!datasets.some(x=>x.id===state.selected))state.selected=datasets[0]?.id||'';if(state.selected)await loadDataset(state.selected)}
async function loadDirectory(){const result=await api('/api/dataset-directory');state.datasetDir=result.path;state.directorySummary=result}
async function loadSettings(){live.settings=await api('/api/settings')}
async function loadRuntime(){const result=await api('/api/runtime/status');live.runtime=result;if(result.status==='active'){state.active=result.dataset_id;state.activeRev=result.dataset_revision;state.execution=result.execution_id;state.demo=result.case_id==='manual'?'manual':'busy';await loadDataset(result.dataset_id)}else{state.demo='idle';state.execution='';state.active=state.selected;state.activeRev=ds()?.rev||0}}
const LEFT_LAYOUT_KEY='smartkit.layout.leftWidth';
const LOG_LAYOUT_KEY='smartkit.layout.logHeight';
function clampLayout(value,min,max){return Math.min(max,Math.max(min,value))}
function cssPixels(property,fallback){const value=parseFloat(getComputedStyle(document.documentElement).getPropertyValue(property));return Number.isFinite(value)?value:fallback}
function applyPersistedLayout(){if(typeof localStorage==='undefined')return;const left=Number(localStorage.getItem(LEFT_LAYOUT_KEY)),log=Number(localStorage.getItem(LOG_LAYOUT_KEY));if(Number.isFinite(left)&&left>0)document.documentElement.style.setProperty('--left-pane-width',`${left}px`);if(Number.isFinite(log)&&log>0)document.documentElement.style.setProperty('--log-pane-height',`${log}px`)}
function startLayoutResize(event,direction){if(event.button!==undefined&&event.button!==0)return;event.preventDefault();const handle=event.currentTarget,startX=event.clientX,startY=event.clientY,vertical=direction==='vertical',initial=vertical?cssPixels('--left-pane-width',270):cssPixels('--log-pane-height',100);handle.classList.add('dragging');const move=pointer=>{if(vertical){const containerWidth=handle.parentElement?.clientWidth||window.innerWidth;const value=clampLayout(initial+pointer.clientX-startX,210,Math.max(260,containerWidth-360));document.documentElement.style.setProperty('--left-pane-width',`${value}px`)}else{const value=clampLayout(initial+startY-pointer.clientY,70,Math.max(120,Math.floor(window.innerHeight*.55)));document.documentElement.style.setProperty('--log-pane-height',`${value}px`)}};const stop=()=>{handle.classList.remove('dragging');document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',stop);document.removeEventListener('pointercancel',stop);const property=vertical?'--left-pane-width':'--log-pane-height',key=vertical?LEFT_LAYOUT_KEY:LOG_LAYOUT_KEY,fallback=vertical?270:100;if(typeof localStorage!=='undefined')localStorage.setItem(key,String(Math.round(cssPixels(property,fallback))))};document.addEventListener('pointermove',move);document.addEventListener('pointerup',stop);document.addEventListener('pointercancel',stop)}
function resetLayoutSize(direction){const vertical=direction==='vertical',property=vertical?'--left-pane-width':'--log-pane-height',key=vertical?LEFT_LAYOUT_KEY:LOG_LAYOUT_KEY,value=vertical?270:100;document.documentElement.style.setProperty(property,`${value}px`);if(typeof localStorage!=='undefined')localStorage.removeItem(key)}
async function bootstrap(){try{applyPersistedLayout();await loadDirectory();await loadSettings();await loadDatasetPage();await loadRuntime();state.server=await api('/api/services/status');render();pollBackendLogs()}catch(error){toast(error.message)}}

datasetSidebar=function(){const pages=live.datasetPages,start=(state.datasetPage-1)*state.datasetPageSize;return `<aside class="dataset-sidebar"><div class="dataset-sidebar-head"><div style="display:flex;align-items:center;gap:8px"><strong>模拟数据集</strong><span class="badge neutral">${live.datasetTotal.toLocaleString()} 个文件</span><span class="grow"></span><button class="btn icon-btn primary" onclick="openCreate(false)" title="新增数据集">＋</button></div><div style="margin-top:9px"><input class="search-sm" value="${esc(state.datasetKeyword||'')}" onkeydown="if(event.key==='Enter')searchDatasets(this.value)" placeholder="搜索名称或文件名，回车查询"></div></div><div class="dataset-list">${datasets.map(d=>`<div class="dataset-entry ${d.id===state.selected?'active':''}" onclick="selectDataset('${d.id}')"><strong>${esc(d.name)}</strong><small class="mono">${esc(d.id)}.json</small><small>Rev.${d.rev} · ${d.ssh} SSH / ${d.rest} REST</small></div>`).join('')||'<div class="empty">当前目录没有数据集文件</div>'}</div><div class="pager"><span>${live.datasetTotal?start+1:0}-${Math.min(start+datasets.length,live.datasetTotal)} / ${live.datasetTotal.toLocaleString()}</span><span class="grow"></span><button class="btn" onclick="changeDatasetPage(-1)" ${state.datasetPage===1?'disabled':''}>‹</button><span>${state.datasetPage}/${pages}</span><button class="btn" onclick="changeDatasetPage(1)" ${state.datasetPage===pages?'disabled':''}>›</button></div><div class="panel-actions"><button class="btn" onclick="openDatasetManager()">全部管理</button><button class="btn" onclick="openImport()">导入文件</button></div></aside>`}
workbenchFileInfo=function(){const d=ds(),body=`{\n  "schema_version": 1,\n  "id": "${d.id}",\n  "name": "${d.name}",\n  "revision": ${d.rev},\n  "ssh": { "commands": [ ... ] },\n  "rest": { "routes": [ ... ] }\n}`;return `<div class="file-panel"><div class="file-layout"><section class="file-card"><h3>数据集基本信息</h3><label class="field">数据集名称<div style="display:flex;gap:8px;align-items:end"><input id="datasetName" value="${esc(d.name)}" maxlength="120" onkeydown="if(event.key==='Enter')saveDatasetName()"><button class="btn primary" onclick="saveDatasetName()">保存名称</button></div></label><div class="hint">名称可以修改；文件 ID 和文件名保持不变，关联用例不会受到影响。</div><table class="table" style="margin-top:12px"><tr><th>文件名</th><td class="mono">${esc(d.id)}.json</td></tr><tr><th>完整路径</th><td class="mono">${esc(state.datasetDir)}/${esc(d.id)}.json</td></tr><tr><th>最近修改</th><td>${esc(d.updated)}</td></tr><tr><th>校验状态</th><td><span class="badge success">格式有效</span></td></tr></table><div class="quick-row" style="margin-top:12px"><button class="btn" onclick="exportDataset()">导出文件</button></div></section><section class="file-card"><h3>文件预览</h3><pre class="file-preview">${esc(body)}</pre></section></div><div class="file-rule" style="margin-top:12px"><b>一数据集一文件：</b>修改名称只更新文件内容和修订号，不修改文件 ID、文件名及用例关联。</div></div>`}

createModal=function(){return createModalBase().replace(/onclick="openDatasetManager\(\)"(?=>[^<]*<\/button><button class="btn primary" onclick="createDataset\()/,'onclick="closeModal()"')}
function openRenameDataset(){state.modal='renameDataset';state.modalData={};renderModal()}
function renameDatasetModal(){return modalFrame('修改数据集名称',`<label class="field">数据集名称<input id="renameDatasetName" value="${esc(ds().name)}" maxlength="120" onkeydown="if(event.key==='Enter')confirmRenameDataset()"></label><div class="hint">只修改显示名称；文件 ID、文件名和用例关联保持不变。</div>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="confirmRenameDataset()">保存</button>`,true)}
async function confirmRenameDataset(){const detail=currentDetail(),name=document.getElementById('renameDatasetName')?.value.trim();if(!detail||!name)return toast('数据集名称不能为空');if(name===detail.name)return toast('数据集名称未发生变化');try{const saved=await api('/api/datasets/'+encodeURIComponent(detail.id),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({...detail,name})});live.details.set(saved.id,saved);const meta=datasetMeta(saved),index=datasets.findIndex(item=>item.id===saved.id);if(index>=0)datasets[index]=meta;closeModal();render();toast(`数据集名称已修改为 ${saved.name} · Rev.${saved.revision}`)}catch(error){toast(error.message)}}
async function searchDatasets(value){state.datasetKeyword=value;state.datasetPage=1;await loadDatasetPage();render()}
changeDatasetPage=async function(delta){state.datasetPage=Math.max(1,Math.min(live.datasetPages,state.datasetPage+delta));await loadDatasetPage();render()}
selectDataset=async function(id){if(state.dirty&&!confirm('当前有未保存内容，确定放弃并切换数据集？'))return;state.selected=id;state.dirty=false;state.editing=false;state.selectedItem=0;await loadDataset(id);if(state.worktab==='bindings')await loadBindings();render()}

editor=function(){const rest=state.tab==='rest',detail=currentDetail()||{},context=groupContext(),v=viewDataset(),maintaining=state.page==='workbench',groups=allGroupNames(context);const grouped=groups.map(group=>{const rows=context.items.map((item,index)=>({item,index})).filter(entry=>normalizedGroup(entry.item)===group);if(!rows.length&&!context.groups.includes(group))return'';return `<div class="group ${state.selectedGroup===group?'active':''}" onclick="selectGroup('${esc(group)}')"><span>${esc(group)}</span><span class="grow"></span><span>${rows.length}</span></div>${rows.map(({item,index})=>`<div class="item ${state.selectedItem===index?'active':''}" onclick="selectItem(${index})">${rest?`<span class="method">${esc(item.method||'GET')}</span>${esc(item.uri||'/')}`:esc(item.name||'')}</div>`).join('')}`}).join('');return `<div class="content"><aside class="list-panel"><div class="panel-title"><span>${rest?'REST 路由':'SSH 命令'}</span><span class="grow"></span><span class="muted">${context.items.length}</span></div><div class="list-search"><input class="search-sm" placeholder="搜索${rest?'路由':'命令'}"></div><div class="list">${grouped||'<div class="empty">暂无数据</div>'}</div>${maintaining?`<div class="panel-actions-stack"><div class="action-row item-actions"><button class="btn" onclick="newEntry()">＋ 新增</button>${rest?'<button class="btn" onclick="openLogImport()" title="根据日志导入 REST 路由">日志导入</button>':'<button class="btn" onclick="openSshLogImport()" title="根据日志导入 SSH 命令">日志导入</button>'}<button class="btn" onclick="moveEntry()">移动</button><button class="btn danger" onclick="deleteEntry()">删除</button></div><div class="action-row group-actions"><button class="btn" onclick="createGroup()">＋ 分组</button><button class="btn" onclick="renameGroup()">重命名</button><button class="btn" onclick="deleteGroup()">删分组</button></div></div>`:''}</aside><div class="layout-resizer vertical" role="separator" aria-orientation="vertical" tabindex="0" title="拖动调整左右宽度；双击恢复默认" onpointerdown="startLayoutResize(event,'vertical')" ondblclick="resetLayoutSize('vertical')"></div><section class="editor"><div class="editor-head"><h3>${rest?'REST 路由':'SSH 命令'}${maintaining?'编辑器':'运行快照'}</h3>${maintaining?`<span class="badge ${state.dirty?'warn':'neutral'}">${state.dirty?'未保存':'已保存'}</span>`:'<span class="badge info">只读</span>'}<span class="grow"></span><span class="muted mono" style="font-size:10px">${esc(v.id)}@${maintaining?v.rev:state.activeRev}</span></div>${rest?restForm():sshForm()}</section></div>`}

restForm=function(){const detail=currentDetail(),item=detail?.rest_routes?.[state.selectedItem]||{};return `<div class="form-grid" oninput="markDirty()" onchange="markDirty()"><label class="field">HTTP 方法<select id="routeMethod" ${disabled()}>${['GET','POST','PUT','PATCH','DELETE'].map(v=>`<option ${v===(item.method||'GET')?'selected':''}>${v}</option>`).join('')}</select></label><label class="field">URI<input id="routeUri" ${disabled()} value="${esc(item.uri||'')}"></label><label class="field">状态码<input id="routeStatus" ${disabled()} value="${item.status_code||200}"></label><label class="field full">响应头（JSON）<input id="routeHeaders" ${disabled()} value="${esc(JSON.stringify(item.response_headers||{}))}"></label><label class="field full">响应体<textarea id="routeBody" ${disabled()}>${esc(item.response_body||'')}</textarea></label></div><div class="hint ${state.page==='workbench'&&isMismatch()?'warning-hint':''}">${state.page!=='workbench'?'这里展示当前执行快照；如需修改，请前往数据集工作台。':'保存只更新当前数据集文件，不改变运行快照。'}</div>${editActions('REST 路由')}`}
sshForm=function(){const detail=currentDetail(),item=detail?.commands?.[state.selectedItem]||{};return `<div class="form-grid" oninput="markDirty()" onchange="markDirty()"><label class="field full">命令名称<input id="commandName" ${disabled()} value="${esc(item.name||'')}"></label><label class="field full">说明<input id="commandDescription" ${disabled()} value="${esc(item.description||'')}"></label><label class="field full">输出<textarea id="commandOutput" ${disabled()}>${esc(item.output||'')}</textarea></label></div><div class="hint ${isMismatch()?'warning-hint':''}">SSH 认证来自全局设置，数据集只保存命令响应。</div>${editActions('SSH 命令')}`}
editActions=function(){if(state.page!=='workbench')return `<div class="editor-actions"><button class="btn" onclick="setPage('workbench')">前往工作台维护</button></div>`;return `<div class="editor-actions"><button class="btn" onclick="toggleEdit()">${state.editing?'取消编辑':'编辑'}</button><button class="btn primary save-editor-action" onclick="saveRevision()" ${state.editing?'':'disabled'}>保存数据集文件</button><div class="editor-test-actions">${state.tab==='rest'?'<button class="btn" onclick="testCurrentRoute()">测试当前路由</button>':'<button class="btn" onclick="copySshTestCommand()">复制 SSH 测试命令</button>'}</div></div>`}
async function copySshTestCommand(){const detail=currentDetail()||{},server=live.settings?.ssh_server||{},item=detail.commands?.[state.selectedItem]||{},host=(server.bind_address||'127.0.0.1')==='0.0.0.0'?'127.0.0.1':server.bind_address||'127.0.0.1',port=server.port||2222,user=server.username||'admin',command=String(item.name||'').replace(/"/g,'\\"'),text=`ssh -p ${port} ${user}@${host} "${command}"`;try{await navigator.clipboard.writeText(text);toast('SSH 测试命令已复制到剪贴板')}catch(error){toast(`复制失败：${error.message}`)}}
async function testCurrentRoute(){const server=live.settings?.rest_server||{},host=(server.bind_address||'127.0.0.1')==='0.0.0.0'?'127.0.0.1':server.bind_address||'127.0.0.1',port=server.port||8080,method=document.getElementById('routeMethod')?.value||'GET',uri=document.getElementById('routeUri')?.value.trim()||'/';try{const result=await api('/api/rest/test',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({method,url:`https://${host}:${port}${uri}`,headers:{},body:''})});state.modal='routeTest';state.modalData={method,uri,result};renderModal()}catch(error){toast(`路由测试失败：${error.message}`)}}
function routeTestModal(){const data=state.modalData||{},result=data.result||{};return modalFrame('REST 路由测试结果',`<div class="confirm-box"><strong>${esc(data.method||'GET')} ${esc(data.uri||'/')}</strong><span>状态码：${esc(result.status_code||'-')} · 耗时：${esc(result.elapsed_ms||'-')} ms · TLS：${esc(result.tls_version||'-')}</span></div><label class="field">响应头<pre class="file-preview">${esc(JSON.stringify(result.response_headers||[],null,2))}</pre></label><label class="field" style="margin-top:10px">响应体<pre class="file-preview">${esc(result.response_body||'')}</pre></label>`,`<button class="btn" onclick="closeModal()">关闭</button>`)}
newEntry=function(){const detail=currentDetail();if(!detail)return;const group=state.selectedGroup&&state.selectedGroup!=='Ungrouped'?state.selectedGroup:'';if(state.tab==='rest')detail.rest_routes.unshift({method:'GET',uri:'/new-route',group,status_code:200,response_headers:{},response_body:''});else detail.commands.unshift({name:'new command',description:'',group,output:''});syncEditorData(detail);state.selectedItem=0;state.editing=true;state.dirty=true;render()}
function deleteEntry(){const detail=currentDetail();if(!detail)return;const items=state.tab==='rest'?detail.rest_routes:detail.commands;if(!items.length)return;if(!confirm(`确定删除当前${state.tab==='rest'?' REST 路由':' SSH 命令'}？`))return;items.splice(state.selectedItem,1);state.selectedItem=Math.max(0,Math.min(state.selectedItem,items.length-1));state.dirty=true;syncEditorData(detail);render()}
async function saveDatasetName(){const detail=currentDetail(),input=document.getElementById('datasetName'),name=input?.value.trim();if(!detail||!name)return toast('数据集名称不能为空');if(name===detail.name)return toast('数据集名称未发生变化');try{const saved=await api('/api/datasets/'+encodeURIComponent(detail.id),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({...detail,name})});live.details.set(saved.id,saved);const meta=datasetMeta(saved),index=datasets.findIndex(item=>item.id===saved.id);if(index>=0)datasets[index]=meta;render();toast(`数据集名称已修改为 ${saved.name} · Rev.${saved.revision}`)}catch(error){toast(error.message)}}
saveRevision=async function(){const detail=currentDetail();if(!detail)return;try{if(state.tab==='rest'){const item=detail.rest_routes[state.selectedItem];item.method=document.getElementById('routeMethod').value;item.uri=document.getElementById('routeUri').value.trim();item.status_code=Number(document.getElementById('routeStatus').value);item.response_headers=JSON.parse(document.getElementById('routeHeaders').value||'{}');item.response_body=document.getElementById('routeBody').value}else{const item=detail.commands[state.selectedItem];item.name=document.getElementById('commandName').value.trim();item.description=document.getElementById('commandDescription').value;item.output=document.getElementById('commandOutput').value}const saved=await api('/api/datasets/'+encodeURIComponent(detail.id),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(detail)});live.details.set(saved.id,saved);const meta=datasetMeta(saved),index=datasets.findIndex(x=>x.id===saved.id);if(index>=0)datasets[index]=meta;state.dirty=false;state.editing=false;syncEditorData(saved);render();toast(`已保存 ${saved.id}.json · Rev.${saved.revision}`)}catch(error){toast(error.message)}}

async function loadBindings(){const result=await api(`/api/bindings?dataset_id=${encodeURIComponent(state.selected)}&page=${state.casePage}&page_size=${state.casePageSize}`);live.bindings=result.items;live.bindingTotal=result.total;live.bindingPages=Math.max(1,Math.ceil(result.total/result.page_size))}
workbenchBindings=function(){const start=(state.casePage-1)*state.casePageSize;return `<div class="binding-page"><div class="binding-summary"><strong>${esc(ds().name)}</strong> 当前关联 <b>${live.bindingTotal}</b> 个用例；多个用例可以复用 <span class="mono">${esc(ds().id)}.json</span>。</div><div class="binding-toolbar"><span class="grow"></span><button class="btn primary" onclick="openBindCases()">＋ 关联用例</button></div><table class="table"><thead><tr><th>用例 ID</th><th>用例名称</th><th>模块</th><th>数据集文件</th><th>状态</th><th>操作</th></tr></thead><tbody>${live.bindings.map(c=>`<tr><td class="case-id">${esc(c.case_id)}</td><td>${esc(c.name)}</td><td>${esc(c.module)}</td><td><span class="badge info mono">${esc(c.dataset_id)}.json</span></td><td><span class="badge ${c.valid?'success':'danger'}">${c.valid?'有效':'失效'}</span></td><td><button class="btn danger" onclick="unbindCase('${esc(c.case_id)}')">解除</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">暂无关联用例</td></tr>'}</tbody></table><div class="pager"><span>${live.bindingTotal?start+1:0}-${Math.min(start+live.bindings.length,live.bindingTotal)} / ${live.bindingTotal}</span><span class="grow"></span><select onchange="changeCasePageSize(this.value)"><option value="8">8 条/页</option><option value="20">20 条/页</option><option value="50">50 条/页</option></select><button class="btn" onclick="changeCasePage(-1)" ${state.casePage===1?'disabled':''}>‹</button><span>${state.casePage}/${live.bindingPages}</span><button class="btn" onclick="changeCasePage(1)" ${state.casePage===live.bindingPages?'disabled':''}>›</button></div></div>`}
setWorktab=async function(tab){state.worktab=tab;if(tab==='ssh'||tab==='rest')state.tab=tab;state.selectedItem=0;state.editing=false;state.dirty=false;if(tab==='bindings')await loadBindings();render()}
changeCasePage=async function(delta){state.casePage=Math.max(1,Math.min(live.bindingPages,state.casePage+delta));await loadBindings();render()}
changeCasePageSize=async function(size){state.casePageSize=Number(size);state.casePage=1;await loadBindings();render()}
async function unbindCase(caseId){try{await api('/api/bindings/'+encodeURIComponent(caseId),{method:'DELETE'});await loadBindings();render();toast('已解除用例绑定')}catch(error){toast(error.message)}}

bindCasesModal=function(){return modalFrame(`关联用例到 ${esc(ds().id)}.json`,`<div class="binding-summary">从用例目录选择测试用例并绑定到当前数据集文件。</div><div class="binding-toolbar"><input id="caseSearch" placeholder="搜索用例 ID 或名称"><button class="btn" onclick="loadCaseCandidates()">查询</button></div><table class="table"><thead><tr><th></th><th>用例 ID</th><th>名称</th><th>模块</th><th>当前数据集</th></tr></thead><tbody id="caseCandidateRows">${live.cases.map(c=>`<tr><td><input class="case-choice" type="checkbox" value="${esc(c.case_id)}"></td><td class="case-id">${esc(c.case_id)}</td><td>${esc(c.name)}</td><td>${esc(c.module)}</td><td>${esc(c.dataset_id||'未关联')}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">点击查询加载用例</td></tr>'}</tbody></table>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="fakeBindCases()">关联所选用例</button>`)}
openBindCases=async function(){state.modal='bindCases';state.modalData={};await loadCaseCandidates();renderModal()}
async function loadCaseCandidates(){try{const keyword=document.getElementById('caseSearch')?.value||'';const result=await api(`/api/cases?page=1&page_size=100&keyword=${encodeURIComponent(keyword)}`);live.cases=result.items;live.caseTotal=result.total;renderModal()}catch(error){toast(error.message)}}
fakeBindCases=async function(){const ids=[...document.querySelectorAll('.case-choice:checked')].map(x=>x.value);try{for(const caseId of ids)await api('/api/bindings/'+encodeURIComponent(caseId),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({dataset_id:state.selected})});closeModal();await loadBindings();render();toast(`已关联 ${ids.length} 个用例`)}catch(error){toast(error.message)}}

createDataset=async function(copy){const name=document.getElementById('newName').value.trim(),id=document.getElementById('newId').value.trim(),description=document.getElementById('newDesc').value.trim();if(!name||!id)return toast('名称和 ID 不能为空');try{let result;if(copy)result=await api('/api/datasets/'+encodeURIComponent(state.selected)+'/copy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,name})});else result=await api('/api/datasets',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,name,description,tags:(document.getElementById('newTags').value||'').split(',').map(x=>x.trim()).filter(Boolean),commands:[],rest_routes:[]})});state.selected=result.id;state.datasetPage=1;closeModal();await loadDatasetPage();render();toast(`已创建 ${result.id}.json`)}catch(error){toast(error.message)}}
exportDataset=function(id=state.selected){location.href='/api/datasets/'+encodeURIComponent(id)+'/export'}
importModal=function(){return modalFrame('导入数据集文件',`<label class="field">选择 JSON 文件<input id="importDatasetFile" type="file" accept=".json"></label><div class="hint">导入前会校验文件 ID、命令和 REST 路由结构；不会覆盖同名文件。</div>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="fakeImport()">校验并导入文件</button>`)}
fakeImport=async function(){const file=document.getElementById('importDatasetFile').files[0];if(!file)return toast('请选择 JSON 文件');try{const dataset=JSON.parse(await file.text());await api('/api/datasets/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({dataset})});closeModal();await loadDatasetPage();render();toast('数据集导入成功')}catch(error){toast(error.message)}}
const renderStandardModal=renderModal;
renderModal=function(){if(state.modal==='logImport'){document.getElementById('modalRoot').innerHTML=logImportModal();return}if(state.modal==='sshLogImport'){document.getElementById('modalRoot').innerHTML=sshLogImportModal();return}if(state.modal==='renameDataset'){document.getElementById('modalRoot').innerHTML=renameDatasetModal();return}if(state.modal==='routeTest'){document.getElementById('modalRoot').innerHTML=routeTestModal();return}return renderStandardModal()}
function openLogImport(){state.modal='logImport';state.modalData={preview:null};renderModal()}
function logImportModal(){const preview=state.modalData?.preview,groups=allGroupNames({items:currentDetail()?.rest_routes||[],groups:currentDetail()?.rest_groups||[]}),selectable=(preview?.summary?.importable||0)+(preview?.summary?.duplicate||0);return modalFrame('根据日志导入 REST 路由',`<label class="field">粘贴 Redfish 请求日志<textarea id="restLogText" style="height:150px" placeholder="包含 ##url、##method 和 ##result 的日志内容">${esc(state.modalData?.logText||'')}</textarea></label><div class="toolbar" style="margin-top:10px"><label class="field">导入到分组<select id="logImportGroup">${groups.map(group=>`<option value="${esc(group)}">${esc(group)}</option>`).join('')}</select></label><span class="grow"></span><button class="btn" onclick="previewLogImport()">解析日志</button></div>${preview?`<div class="binding-summary">共解析 ${preview.summary.total} 条：可导入 ${preview.summary.importable}，可覆盖 ${preview.summary.duplicate}，缺少响应 ${preview.summary.incomplete}</div><table class="table"><thead><tr><th></th><th>方法</th><th>URI</th><th>状态</th></tr></thead><tbody>${preview.routes.map((entry,index)=>`<tr><td><input class="log-route-choice" type="checkbox" value="${index}" ${entry.status==='ready'?'checked':entry.status==='duplicate'?'':'disabled'}></td><td>${esc(entry.route.method)}</td><td class="mono">${esc(entry.route.uri)}</td><td><span class="badge ${entry.status==='ready'?'success':entry.status==='duplicate'?'warn':'danger'}">${esc(entry.status)}</span></td></tr>`).join('')}</tbody></table>`:'<div class="empty">粘贴日志后点击“解析日志”预览可导入路由</div>'}`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="confirmLogImport()" ${selectable?'':'disabled'}>导入所选路由</button>`)}
async function previewLogImport(){const text=document.getElementById('restLogText').value;if(!text.trim())return toast('请粘贴日志内容');try{const result=await api('/api/rest/import-log/preview',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({dataset_id:state.selected,log_text:text})});state.modalData={...(state.modalData||{}),logText:text,preview:result};renderModal()}catch(error){toast(error.message)}}
async function confirmLogImport(){const detail=currentDetail(),preview=state.modalData?.preview;if(!detail||!preview)return;const selected=new Set([...document.querySelectorAll('.log-route-choice:checked')].map(input=>Number(input.value))),target=document.getElementById('logImportGroup')?.value||'Ungrouped';preview.routes.forEach((entry,index)=>{if(!selected.has(index)||!['ready','duplicate'].includes(entry.status))return;const route={...entry.route,group:target==='Ungrouped'?'':target},position=detail.rest_routes.findIndex(item=>(item.method||'GET').toUpperCase()===route.method.toUpperCase()&&item.uri===route.uri);if(position>=0)detail.rest_routes[position]=route;else detail.rest_routes.push(route)});try{const saved=await api('/api/datasets/'+encodeURIComponent(detail.id),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(detail)});live.details.set(saved.id,saved);const meta=datasetMeta(saved),position=datasets.findIndex(item=>item.id===saved.id);if(position>=0)datasets[position]=meta;syncEditorData(saved);state.dirty=false;closeModal();render();toast(`已导入或覆盖 ${selected.size} 条 REST 路由`)}catch(error){toast(error.message)}}
function openSshLogImport(){state.modal='sshLogImport';state.modalData={preview:null};renderModal()}
function sshLogImportModal(){const preview=state.modalData?.preview,detail=currentDetail()||{},groups=allGroupNames({items:detail.commands||[],groups:detail.command_groups||[]}),selectedGroup=state.selectedGroup||'Ungrouped',selectable=(preview?.summary?.importable||0)+(preview?.summary?.duplicate||0);return modalFrame('根据日志导入 SSH 命令',`<label class="field">粘贴 SSH 执行日志<textarea id="sshLogText" style="height:170px" placeholder="包含 Execute command line 和 Receive str 的日志内容">${esc(state.modalData?.logText||'')}</textarea></label><div class="toolbar" style="margin-top:10px"><label class="field">导入到分组<select id="sshLogImportGroup">${groups.map(group=>`<option value="${esc(group)}" ${group===selectedGroup?'selected':''}>${esc(group)}</option>`).join('')}</select></label><span class="grow"></span><button class="btn" onclick="previewSshLogImport()">解析日志</button></div>${preview?`<div class="binding-summary">共解析 ${preview.summary.total} 条：可导入 ${preview.summary.importable}，可覆盖 ${preview.summary.duplicate}，缺少响应 ${preview.summary.incomplete}</div><table class="table"><thead><tr><th></th><th>命令</th><th>输出摘要</th><th>状态</th></tr></thead><tbody>${preview.commands.map((entry,index)=>`<tr><td><input class="ssh-command-choice" type="checkbox" value="${index}" ${entry.status==='ready'?'checked':entry.status==='duplicate'?'':'disabled'}></td><td class="mono">${esc(entry.command.name)}</td><td class="mono" style="max-width:280px;overflow:hidden;text-overflow:ellipsis">${esc(String(entry.command.output||'').replace(/\s+/g,' ').slice(0,100)||'-')}</td><td><span class="badge ${entry.status==='ready'?'success':entry.status==='duplicate'?'warn':'danger'}">${esc(entry.status)}</span></td></tr>`).join('')}</tbody></table>`:'<div class="empty">粘贴日志后点击“解析日志”预览可导入命令</div>'}`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="confirmSshLogImport()" ${selectable?'':'disabled'}>导入所选命令</button>`)}
async function previewSshLogImport(){const text=document.getElementById('sshLogText').value;if(!text.trim())return toast('请粘贴 SSH 日志内容');try{const result=await api('/api/ssh/import-log/preview',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({dataset_id:state.selected,log_text:text})});state.modalData={...(state.modalData||{}),logText:text,preview:result};renderModal()}catch(error){toast(error.message)}}
async function confirmSshLogImport(){const detail=currentDetail(),preview=state.modalData?.preview;if(!detail||!preview)return;const selected=new Set([...document.querySelectorAll('.ssh-command-choice:checked')].map(input=>Number(input.value))),target=document.getElementById('sshLogImportGroup')?.value||'Ungrouped';preview.commands.forEach((entry,index)=>{if(!selected.has(index)||!['ready','duplicate'].includes(entry.status))return;const command={...entry.command,group:target==='Ungrouped'?'':target},position=detail.commands.findIndex(item=>item.name===command.name);if(position>=0)detail.commands[position]=command;else detail.commands.push(command)});try{const saved=await api('/api/datasets/'+encodeURIComponent(detail.id),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(detail)});live.details.set(saved.id,saved);const meta=datasetMeta(saved),position=datasets.findIndex(item=>item.id===saved.id);if(position>=0)datasets[position]=meta;syncEditorData(saved);state.dirty=false;closeModal();render();toast(`已导入或覆盖 ${selected.size} 条 SSH 命令`)}catch(error){toast(error.message)}}

directoryModal=function(){return modalFrame('更改数据集目录',`<label class="field">目录路径<input id="newDatasetDir" value="${esc(state.datasetDir)}"></label><div class="quick-row" style="margin-top:10px"><button class="btn" onclick="validateDatasetDirectory()">验证目录</button></div><div id="directoryValidation" class="confirm-box" style="margin-top:13px"><strong>当前目录</strong><span>${state.directorySummary?.dataset_count||0} 个有效数据集文件</span></div><div class="hint warning-hint">切换目录不会替换正在运行的执行快照。</div>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="applyDatasetDirectory()">切换并重新扫描</button>`,true)}
async function validateDatasetDirectory(){try{const result=await api('/api/dataset-directory/validate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:document.getElementById('newDatasetDir').value})});document.getElementById('directoryValidation').innerHTML=`<strong>目录有效</strong><span>${result.dataset_count} 个有效文件，${result.invalid_count} 个无效文件</span>`}catch(error){toast(error.message)}}
applyDatasetDirectory=async function(){try{const result=await api('/api/dataset-directory/switch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:document.getElementById('newDatasetDir').value})});state.datasetDir=result.path;state.directorySummary=result;state.datasetPage=1;closeModal();await loadDatasetPage();render();toast('数据集目录已切换并重新扫描')}catch(error){toast(error.message)}}
saveSettings=async function(){const directory=document.getElementById('settingsDatasetDir')?.value.trim(),payload={ssh_server:{bind_address:document.getElementById('settingsSshBindAddress')?.value.trim(),port:Number(document.getElementById('settingsSshPort')?.value),username:document.getElementById('settingsSshUsername')?.value.trim(),password:document.getElementById('settingsSshPassword')?.value||''},rest_server:{bind_address:document.getElementById('settingsRestBindAddress')?.value.trim(),port:Number(document.getElementById('settingsRestPort')?.value)},lease_timeout_seconds:Number(document.getElementById('settingsLeaseTimeout')?.value||1800)};try{live.settings=await api('/api/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(directory&&directory!==state.datasetDir){const result=await api('/api/dataset-directory/switch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:directory})});state.datasetDir=result.path;state.directorySummary=result;state.datasetPage=1;await loadDatasetPage()}closeModal();render();toast('全局设置已保存，服务将在下次启动时使用新地址')}catch(error){toast(error.message)}}

activateSelected=async function(){try{const result=await api('/api/runtime/activate-dataset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({dataset_id:state.selected,execution_id:'manual-ui-'+Date.now()})});live.runtime=result;state.active=result.dataset_id;state.activeRev=result.dataset_revision;state.execution=result.execution_id;state.demo='manual';closeModal();render();toast(`已激活 ${result.dataset_file}`)}catch(error){toast(error.message)}}
activateModal=function(){const d=ds();if(live.runtime?.status==='active')return modalFrame('无法激活数据集',`<div class="conflict"><strong>模拟器正被占用</strong><br>执行标识：<span class="mono">${esc(live.runtime.execution_id)}</span><br>运行数据：${esc(live.runtime.dataset_file)} Rev.${live.runtime.dataset_revision}</div>`,`<button class="btn" onclick="closeModal()">知道了</button>`,true);return modalFrame('激活模拟数据集文件',`<div class="confirm-box"><strong>${esc(d.name)} Rev.${d.rev}</strong><span class="mono muted">${esc(state.datasetDir)}\\${esc(d.id)}.json</span></div><p class="muted">将读取并复制为不可变执行快照。</p>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="activateSelected()">读取并激活</button>`,true)}
runtimeOverview=function(){const r=runtime(),status=live.runtime||{};return `<div class="runtime-overview"><section class="runtime-card"><h3>当前执行快照</h3><div class="confirm-box"><strong>${esc(r.name)} Rev.${state.activeRev}</strong><span class="mono muted">来源：${esc(status.dataset_file||r.id+'.json')} · ${esc(status.execution_id||'manual')}</span></div><div class="protocol-grid"><div class="protocol-card"><strong>SSH 模拟服务</strong><p>${esc(status.ssh_endpoint||'未配置')}<br>${r.ssh} 个命令 · 认证来自全局设置</p><button class="btn" onclick="setRuntimeTab('ssh')">查看 SSH</button></div><div class="protocol-card"><strong>REST HTTPS 模拟服务</strong><p>${esc(status.rest_endpoint||'未配置')}<br>${r.rest} 条路由</p><button class="btn" onclick="setRuntimeTab('rest')">查看 REST</button></div></div></section><section class="runtime-card"><h3>本次加载结果</h3><table class="table"><tr><th>用例</th><td class="case-id">${esc(status.case_id||'manual')}</td></tr><tr><th>数据集文件</th><td class="mono">${esc(status.dataset_file||'')}</td></tr><tr><th>加载修订号</th><td>Rev.${esc(status.dataset_revision||state.activeRev)}</td></tr><tr><th>激活时间</th><td>${esc(status.activated_at||'')}</td></tr><tr><th>校验和</th><td class="mono">${esc(status.checksum||'')}</td></tr></table>${status.case_id==='manual'?'<div class="editor-actions"><button class="btn danger" onclick="releaseCurrentRuntime()">释放手工快照</button></div>':''}<div class="hint">绑定关系在数据集工作台维护，运行页只展示本次加载结果。</div></section></div>`}
serverStrip=function(){const isRest=state.tab==='rest',key=isRest?'rest':'ssh',on=state.server[key],server=isRest?live.settings?.rest_server||{}:live.settings?.ssh_server||{},endpoint=isRest?`https://${server.bind_address||'127.0.0.1'}:${server.port||8080}`:`${server.bind_address||'127.0.0.1'}:${server.port||2222}`;return `<div class="server-strip"><strong>${isRest?'REST HTTPS Server':'SSH Server'}</strong><span class="endpoint mono">${esc(endpoint)}</span><span class="badge dot ${on?'success':'danger'}">${on?'运行中':'已停止'}</span><button class="btn ${on?'danger':'success'}" onclick="toggleServer('${key}')">${on?'停止服务':'启动服务'}</button><span class="grow"></span>${!isRest?`<span class="muted">认证来自全局设置</span>`:''}</div>`}
const renderActiveSimulator=renderSimulator;
renderSimulator=function(){if(state.demo==='idle')return `<div class="app">${appHeader()}<div class="runtime-page-head"><span class="badge neutral">无活动快照</span><span class="grow"></span><button class="btn" onclick="setPage('workbench')">前往数据集工作台</button></div><div class="empty" style="margin:auto"><h2>模拟器当前空闲</h2><p>用例执行器将在运行前按 Case ID 激活数据集，也可以从工作台手工激活。</p></div>${logPanel()}</div>`;return renderActiveSimulator()}
async function releaseCurrentRuntime(){try{await api('/api/runtime/release',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({execution_id:live.runtime.execution_id})});await loadRuntime();render();toast('手工运行快照已释放')}catch(error){toast(error.message)}}
async function pollBackendLogs(){try{const logs=await api('/api/logs');if(logs.length){state.logs.push(...logs);if(state.logs.length>200)state.logs.splice(0,state.logs.length-200);if(state.page==='runtime')render()}}catch(_error){}setTimeout(pollBackendLogs,1000)}

workbenchFileInfo=function(){const d=ds(),detail=live.details.get(d.id)||{};return `<div class="file-panel"><div class="file-layout"><section class="file-card"><h3>数据集文件</h3><table class="table"><tr><th>文件名</th><td class="mono">${esc(d.id)}.json</td></tr><tr><th>完整路径</th><td class="mono">${esc(state.datasetDir)}\\${esc(d.id)}.json</td></tr><tr><th>修订号</th><td>Rev.${d.rev}</td></tr><tr><th>校验状态</th><td><span class="badge success">格式有效</span></td></tr></table><div class="quick-row" style="margin-top:12px"><button class="btn" onclick="exportDataset()">导出文件</button><button class="btn" onclick="loadDataset('${esc(d.id)}').then(render)">重新加载</button></div></section><section class="file-card"><h3>文件预览</h3><pre class="file-preview">${esc(JSON.stringify(detail,null,2))}</pre></section></div><div class="file-rule" style="margin-top:12px"><b>一数据集一文件：</b>保存时通过临时文件原子替换。</div></div>`}
datasetManager=function(){return modalFrame('管理模拟数据集文件',`<div class="toolbar"><span>${live.datasetTotal.toLocaleString()} 个数据集文件</span><span class="grow"></span><button class="btn" onclick="openImport()">导入文件</button><button class="btn" onclick="exportDataset()">导出当前</button><button class="btn" onclick="openCreate(true)">复制文件</button><button class="btn primary" onclick="openCreate(false)">＋ 新建</button></div><table class="table"><thead><tr><th>数据集文件</th><th>修订号</th><th>SSH / REST</th><th>操作</th></tr></thead><tbody>${datasets.map(d=>`<tr><td><strong>${esc(d.name)}</strong><div class="muted mono">${esc(d.id)}.json</div></td><td>Rev.${d.rev}</td><td>${d.ssh} / ${d.rest}</td><td><button class="btn" onclick="chooseDataset('${d.id}')">打开</button></td></tr>`).join('')}</tbody></table>`,`<button class="btn" onclick="closeModal()">关闭</button>`)}
chooseDataset=async function(id){state.modal=null;await selectDataset(id)}

setPage=async function(page){state.page=page;state.selectedItem=0;state.editing=false;state.dirty=false;if(page==='runtime')await loadRuntime();else if(state.selected)await loadDataset(state.selected);render()}
toggleServer=async function(key){try{const globalServer=key==='ssh'?live.settings?.ssh_server||{}:live.settings?.rest_server||{},running=state.server[key];const path=key==='ssh'?'/api/server/':'/api/rest/';if(running)await api(path+'stop',{method:'POST'});else await api(path+'start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(globalServer)});state.server[key]=!running;render()}catch(error){toast(error.message)}}
const renderApprovedPrototype=render;
render=function(){if(!datasets.length){document.getElementById('root').innerHTML=`<div class="app">${appHeader()}<div class="directory-bar"><strong>数据集目录</strong><span class="directory-path mono">${esc(state.datasetDir)}</span><span class="grow"></span><button class="btn" onclick="openDirectory()">更改目录</button></div><div class="empty" style="margin:auto"><h2>当前目录没有数据集文件</h2><p>创建第一个数据集后，即可维护 SSH 命令、REST 路由和用例绑定。</p><button class="btn primary" onclick="openCreate(false)">＋ 新建数据集</button></div></div>`;renderModal();return}renderApprovedPrototype();if(state.page==='workbench'){const bindingButton=[...document.querySelectorAll('.subtab')].find(button=>button.textContent.includes('关联用例'));const badge=bindingButton?.querySelector('.badge');if(badge)badge.textContent=live.bindingTotal;const actions=document.querySelector('.content .panel-actions');if(actions&&actions.lastElementChild)actions.lastElementChild.onclick=deleteEntry}}
const previewParams=new URLSearchParams(location.search);
const previewPage=previewParams.get('page');
const previewTab=previewParams.get('tab');
if(['workbench','runtime'].includes(previewPage))state.page=previewPage;
if(state.page==='runtime'&&['overview','ssh','rest'].includes(previewTab)){state.runtimeTab=previewTab;state.tab=previewTab==='ssh'?'ssh':'rest'}
if(state.page==='workbench'&&['overview','ssh','rest','bindings','file'].includes(previewTab)){state.worktab=previewTab;state.tab=previewTab==='ssh'?'ssh':'rest'}
const previewModal=previewParams.get('modal');
if(['datasets','settings','activate','create','import','directory'].includes(previewModal)){
 state.modal=previewModal;
 state.modalData=previewModal==='datasets'?{showArchived:false}:previewModal==='create'?{copy:false}:{};
}
bootstrap();
</script>
</body>
</html>
