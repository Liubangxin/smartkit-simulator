<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartKit Storage Simulator</title>
<style>
:root {
  --bg: #eef1f5;
  --panel: #ffffff;
  --panel-soft: #f7f9fb;
  --line: #d8dee8;
  --line-strong: #c3ccd9;
  --text: #20252d;
  --muted: #687181;
  --brand: #246bfe;
  --brand-hover: #1853d8;
  --success: #188b55;
  --danger: #c93535;
  --charcoal: #26313d;
  --log-bg: #101820;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { height: 100vh; overflow: hidden; font-family: "Segoe UI", Arial, sans-serif; background: var(--bg); color: var(--text); }
button, input, textarea { font: inherit; }
button { transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease; }
.topbar { min-height: 54px; background: var(--panel); color: var(--text); padding: 10px 18px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--line); box-shadow: 0 1px 6px rgba(31, 42, 55, 0.08); }
.brand { font-size: 15px; font-weight: 700; color: var(--charcoal); margin-right: 8px; white-space: nowrap; }
.topbar label { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.topbar input { height: 30px; padding: 4px 9px; border: 1px solid var(--line-strong); border-radius: 6px; font-size: 13px; background: #fff; color: var(--text); outline: none; }
.topbar input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(36, 107, 254, 0.13); }
.topbar .port-inp { width: 72px; }
.topbar .cred-inp { width: 112px; }
.topbar button { height: 30px; padding: 0 15px; border: 1px solid transparent; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
.btn-start { background: var(--success); color: #fff; }
.btn-start:hover { background: #106c41; }
.btn-stop { background: #fff; color: var(--danger); border-color: #e6b8b8 !important; }
.btn-stop:hover { background: #fff1f1; border-color: #d78282 !important; }
.status { font-size: 12px; font-weight: 700; padding: 5px 11px; border-radius: 999px; border: 1px solid transparent; }
.status.running { background: #e5f6ee; color: var(--success); border-color: #b9e3cd; }
.status.stopped { background: #fbeaea; color: var(--danger); border-color: #efc1c1; }
.main { display: flex; gap: 12px; min-height: 180px; height: calc(100vh - 158px); padding: 12px; }
.left { width: 260px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 1px 5px rgba(31, 42, 55, 0.06); display: flex; flex-direction: column; overflow: hidden; }
.left h3 { padding: 12px 14px; font-size: 13px; letter-spacing: 0; border-bottom: 1px solid var(--line); background: var(--panel-soft); color: var(--charcoal); }
.cmd-list { flex: 1; overflow-y: auto; padding: 6px; }
.cmd-item { padding: 9px 10px; cursor: pointer; border: 1px solid transparent; border-radius: 6px; font-size: 13px; color: #303844; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cmd-item + .cmd-item { margin-top: 3px; }
.cmd-item:hover { background: #f0f5ff; border-color: #d9e5ff; }
.cmd-item.active { background: #e8f0ff; border-color: #b8cdfd; color: #1648a8; font-weight: 700; }
.left-btns { padding: 10px; display: flex; gap: 8px; border-top: 1px solid var(--line); background: var(--panel-soft); }
.left-btns button { flex: 1; height: 30px; font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid var(--line-strong); border-radius: 6px; background: #fff; color: #354052; }
.left-btns button:hover { background: #f3f6fb; border-color: #aeb8c8; }
.right { flex: 1; padding: 18px 20px; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 1px 5px rgba(31, 42, 55, 0.06); }
.right h3 { font-size: 15px; margin-bottom: 16px; color: var(--charcoal); }
.right label { display: block; font-size: 12px; font-weight: 600; margin: 12px 0 5px; color: var(--muted); }
.right input, .right textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line-strong); border-radius: 6px; font-size: 13px; background: #fff; color: var(--text); outline: none; }
.right input:focus, .right textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(36, 107, 254, 0.13); }
.right textarea { min-height: 250px; line-height: 1.45; font-family: Consolas, "Courier New", monospace; resize: vertical; }
.editor-actions { display: flex; gap: 8px; margin-top: 14px; }
.editor-actions button { height: 34px; padding: 0 20px; border: 1px solid transparent; border-radius: 6px; font-size: 13px; font-weight: 700; cursor: pointer; }
.editor-actions button:disabled { cursor: not-allowed; opacity: 0.55; }
.btn-edit { background: #fff; color: var(--charcoal); border-color: var(--line-strong) !important; }
.btn-edit:hover:not(:disabled) { background: #f3f6fb; border-color: #aeb8c8 !important; }
.btn-save { background: var(--brand); color: #fff; }
.btn-save:hover:not(:disabled) { background: var(--brand-hover); }
.right input:disabled, .right textarea:disabled { background: #f4f6f9; color: #566070; cursor: default; border-color: #dfe5ee; }
.log-resizer { height: 8px; cursor: ns-resize; background: #d7dde6; border-top: 1px solid #c3ccd8; border-bottom: 1px solid #aeb8c6; display: flex; align-items: center; justify-content: center; }
.log-resizer::before { content: ""; width: 44px; height: 2px; border-top: 1px solid #697386; border-bottom: 1px solid #697386; opacity: 0.85; }
.log-resizer:hover, body.resizing-log .log-resizer { background: #c9d1dd; }
.log-area { height: 112px; background: var(--log-bg); color: #6df58a; padding: 10px 16px; font-family: Consolas, "Courier New", monospace; font-size: 12px; line-height: 1.45; overflow-y: auto; white-space: pre-wrap; border-top: 1px solid #283542; box-shadow: inset 0 1px 0 rgba(255,255,255,0.03); }
body.resizing-log { cursor: ns-resize; user-select: none; }
.vars { font-size: 11px; color: var(--muted); margin-top: 7px; background: var(--panel-soft); border: 1px solid var(--line); padding: 6px 8px; border-radius: 6px; }
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">SmartKit Simulator</div>
  <label>Port: <input id="port" class="port-inp" type="number" value="2222"></label>
  <label>User: <input id="username" class="cred-inp" type="text" value="admin"></label>
  <label>Pass: <input id="password" class="cred-inp" type="password" value="admin123"></label>
  <button class="btn-start" onclick="startServer()">Start Server</button>
  <button class="btn-stop" onclick="stopServer()">Stop Server</button>
  <span id="status" class="status stopped">Stopped</span>
</div>
<div class="main">
  <div class="left">
    <h3>Commands</h3>
    <div id="cmdList" class="cmd-list"></div>
    <div class="left-btns">
      <button onclick="newCommand()">+ New</button>
      <button onclick="deleteCommand()">Delete</button>
    </div>
  </div>
  <div class="right">
    <h3>Command Editor</h3>
    <label>Command Name:</label>
    <input id="cmdName" type="text" placeholder="e.g. show system general">
    <label>Description:</label>
    <input id="cmdDesc" type="text" placeholder="Brief description">
    <label>Output:</label>
    <textarea id="cmdOutput" rows="16" placeholder="Output text&#10;Supports variables: {date} {time} {sn}"></textarea>
    <div class="vars">Variables: {date} {time} {datetime} {date_mmdd} {date_yyyymmdd} {sn}</div>
    <div class="editor-actions">
      <button id="editBtn" class="btn-edit" onclick="toggleEdit()">Edit</button>
      <button id="saveBtn" class="btn-save" onclick="saveCommand()">Save Command</button>
    </div>
  </div>
</div>
<div id="logResizer" class="log-resizer" title="Drag to resize logs"></div>
<div id="logArea" class="log-area"></div>

<script>
let config = { server: {port:2222, username:"admin", password:"admin123"}, commands: [] };
let selectedIdx = -1;
let isEditing = false;
let logPoll = null;
let logHeight = 112;
let resizingLog = false;
let resizeStartY = 0;
let resizeStartHeight = 112;

async function init() {
  let r = await fetch("/api/config");
  config = await r.json();
  document.getElementById("port").value = config.server.port;
  document.getElementById("username").value = config.server.username;
  document.getElementById("password").value = config.server.password;
  renderList();
  applyEditorMode();
  setupLogResize();
  applyLogHeight(logHeight);
  pollLogs();
}

function clamp(n, min, max) {
  return Math.max(min, Math.min(max, n));
}

function applyLogHeight(height) {
  let topbar = document.querySelector(".topbar");
  let main = document.querySelector(".main");
  let resizer = document.getElementById("logResizer");
  let logArea = document.getElementById("logArea");
  let available = window.innerHeight - topbar.offsetHeight - resizer.offsetHeight;
  let minLog = 70;
  let minMain = 180;
  let maxLog = Math.max(minLog, Math.min(Math.floor(window.innerHeight * 0.6), available - minMain));
  logHeight = clamp(height, minLog, maxLog);
  logArea.style.height = logHeight + "px";
  main.style.height = Math.max(minMain, available - logHeight) + "px";
}

function setupLogResize() {
  let resizer = document.getElementById("logResizer");
  resizer.addEventListener("mousedown", (e) => {
    resizingLog = true;
    resizeStartY = e.clientY;
    resizeStartHeight = logHeight;
    document.body.classList.add("resizing-log");
    e.preventDefault();
  });
  window.addEventListener("mousemove", (e) => {
    if (!resizingLog) return;
    applyLogHeight(resizeStartHeight + resizeStartY - e.clientY);
  });
  window.addEventListener("mouseup", () => {
    if (!resizingLog) return;
    resizingLog = false;
    document.body.classList.remove("resizing-log");
  });
  window.addEventListener("resize", () => applyLogHeight(logHeight));
}

function renderList() {
  let el = document.getElementById("cmdList");
  el.innerHTML = "";
  config.commands.forEach((c, i) => {
    let div = document.createElement("div");
    div.className = "cmd-item" + (i === selectedIdx ? " active" : "");
    div.textContent = c.name;
    div.onclick = () => selectCommand(i);
    el.appendChild(div);
  });
}

function selectCommand(i) {
  selectedIdx = i;
  isEditing = false;
  let c = config.commands[i];
  document.getElementById("cmdName").value = c.name;
  document.getElementById("cmdDesc").value = c.description || "";
  document.getElementById("cmdOutput").value = c.output;
  applyEditorMode();
  renderList();
}

function applyEditorMode() {
  let hasSelection = selectedIdx >= 0;
  document.getElementById("cmdName").disabled = !isEditing;
  document.getElementById("cmdDesc").disabled = !isEditing;
  document.getElementById("cmdOutput").disabled = !isEditing;
  document.getElementById("saveBtn").disabled = !isEditing;
  document.getElementById("editBtn").disabled = !hasSelection;
  document.getElementById("editBtn").textContent = isEditing ? "Cancel" : "Edit";
}

function toggleEdit() {
  if (selectedIdx < 0) return;
  if (isEditing) {
    isEditing = false;
    let c = config.commands[selectedIdx];
    document.getElementById("cmdName").value = c.name;
    document.getElementById("cmdDesc").value = c.description || "";
    document.getElementById("cmdOutput").value = c.output;
  } else {
    isEditing = true;
  }
  applyEditorMode();
}

function commandNameExists(name, ignoreIdx) {
  let normalized = name.trim();
  return config.commands.some((c, i) => i !== ignoreIdx && c.name.trim() === normalized);
}

function nextCommandName(baseName) {
  if (!commandNameExists(baseName, -1)) return baseName;
  let n = 2;
  while (commandNameExists(baseName + "-" + n, -1)) n++;
  return baseName + "-" + n;
}

function newCommand() {
  let name = nextCommandName("new-command");
  config.commands.push({ name: name, description: "", output: "output line" });
  selectCommand(config.commands.length - 1);
  isEditing = true;
  applyEditorMode();
}

function deleteCommand() {
  if (selectedIdx < 0) return alert("Select a command first.");
  if (!confirm("Delete '" + config.commands[selectedIdx].name + "'?")) return;
  config.commands.splice(selectedIdx, 1);
  selectedIdx = -1;
  isEditing = false;
  document.getElementById("cmdName").value = "";
  document.getElementById("cmdDesc").value = "";
  document.getElementById("cmdOutput").value = "";
  applyEditorMode();
  saveConfig();
}

async function saveCommand() {
  if (!isEditing) return alert("Click Edit before modifying a command.");
  let name = document.getElementById("cmdName").value.trim();
  if (!name) return alert("Command name cannot be empty.");
  if (commandNameExists(name, selectedIdx)) return alert("Command name already exists.");
  let cmd = {
    name: name,
    description: document.getElementById("cmdDesc").value.trim(),
    output: document.getElementById("cmdOutput").value
  };
  if (selectedIdx >= 0) config.commands[selectedIdx] = cmd;
  else { config.commands.push(cmd); selectedIdx = config.commands.length - 1; }
  await saveConfig();
  isEditing = false;
  applyEditorMode();
  addLog("Command saved: " + name);
}

async function saveConfig() {
  await fetch("/api/config", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(config) });
  renderList();
}

async function startServer() {
  let port = parseInt(document.getElementById("port").value);
  let username = document.getElementById("username").value.trim();
  let password = document.getElementById("password").value.trim();
  if (!username) return alert("Username required.");
  config.server = { port, username, password };
  await saveConfig();
  await fetch("/api/server/start", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({port,username,password}) });
  document.getElementById("status").textContent = "Running :" + port;
  document.getElementById("status").className = "status running";
}

async function stopServer() {
  await fetch("/api/server/stop", { method: "POST" });
  document.getElementById("status").textContent = "Stopped";
  document.getElementById("status").className = "status stopped";
}

function addLog(msg) {
  let el = document.getElementById("logArea");
  let ts = new Date().toTimeString().slice(0,8);
  el.textContent += "[" + ts + "] " + msg + "\n";
  el.scrollTop = el.scrollHeight;
}

async function pollLogs() {
  try {
    let r = await fetch("/api/logs");
    let logs = await r.json();
    logs.forEach(addLog);
  } catch(e) {}
  logPoll = setTimeout(pollLogs, 300);
}

init();
</script>
</body>
</html>
