<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PROTOTYPE - SmartKit Simulator 数据集界面</title>
<!--
  THROWAWAY PROTOTYPE — 不接后端，不作为生产实现。
  问题：模拟数据集、执行快照与现有 SSH/REST 编辑器应该如何组织？
  三个方案通过 ?variant=A/B/C 或页面底部切换栏对比。
-->
<style>
:root{--bg:#eef1f5;--panel:#fff;--soft:#f7f9fb;--line:#d8dee8;--strong:#c3ccd9;--text:#20252d;--muted:#687181;--brand:#246bfe;--brand2:#1853d8;--success:#188b55;--warn:#a65b00;--danger:#c93535;--dark:#26313d;--log:#101820}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}body{overflow:hidden}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.prototype-flag{position:fixed;right:14px;bottom:16px;z-index:80;padding:5px 9px;border-radius:5px;background:#fff1dc;color:#874b00;border:1px solid #f0d19d;font-size:11px;font-weight:800;letter-spacing:.04em}
.app{height:100%;display:flex;flex-direction:column}.brand{font-size:15px;font-weight:750;color:var(--dark);white-space:nowrap}.muted{color:var(--muted)}.grow{flex:1}.divider{width:1px;background:var(--line);align-self:stretch}.mono{font-family:Consolas,monospace}
.btn{height:32px;padding:0 13px;border:1px solid var(--strong);border-radius:6px;background:#fff;color:#354052;font-size:12px;font-weight:650}.btn:hover{background:#f3f6fb}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.primary:hover{background:var(--brand2)}.btn.ghost{border-color:transparent;background:transparent}.btn.danger{color:var(--danger);border-color:#e6b8b8}.btn:disabled{opacity:.5;cursor:not-allowed}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:750;white-space:nowrap}.badge:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.badge.success{color:var(--success);background:#e5f6ee}.badge.warn{color:var(--warn);background:#fff1dc}.badge.info{color:#1648a8;background:#e8f0ff}.badge.neutral{color:#5d6674;background:#edf0f4}.badge.danger{color:var(--danger);background:#fbeaea}
.tabs{height:43px;display:flex;align-items:flex-end;background:#fff;border-bottom:1px solid var(--line);padding:0 18px}.tab{height:43px;padding:0 18px;border:0;border-bottom:3px solid transparent;background:transparent;color:var(--muted);font-weight:650}.tab.active{color:var(--brand);border-bottom-color:var(--brand)}
.content{flex:1;min-height:0;display:flex;padding:12px;gap:12px}.list-panel,.editor{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 1px 5px rgba(31,42,55,.06)}.list-panel{width:252px;display:flex;flex-direction:column;overflow:hidden}.panel-title{padding:11px 13px;font-size:12px;font-weight:750;background:var(--soft);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.list{padding:7px;overflow:auto;flex:1}.group{margin:4px 0 7px;padding:7px 8px;background:var(--soft);font-size:11px;font-weight:750;color:#495466}.item{padding:9px;border-radius:6px;font-size:12px;margin:2px 0}.item.active{background:#e8f0ff;border:1px solid #b8cdfd;color:#1648a8;font-weight:700}.panel-actions{display:flex;gap:6px;padding:9px;border-top:1px solid var(--line);background:var(--soft)}.panel-actions .btn{flex:1;padding:0 6px}
.editor{flex:1;min-width:0;padding:18px 20px;overflow:auto}.editor-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}.editor h3{font-size:15px;margin:0}.form-grid{display:grid;grid-template-columns:145px 1fr 125px;gap:12px}.field{display:block;font-size:11px;font-weight:650;color:var(--muted)}.field input,.field select,.field textarea{display:block;width:100%;margin-top:5px;border:1px solid var(--strong);border-radius:6px;background:#fff;padding:8px 9px;color:var(--text)}.field textarea{height:178px;resize:none;font-family:Consolas,monospace;line-height:1.45}.full{grid-column:1/-1}.editor-actions{display:flex;gap:8px;margin-top:13px}.hint{font-size:11px;color:var(--muted);padding:7px 9px;background:var(--soft);border:1px solid var(--line);border-radius:6px;margin-top:7px}
.log{height:94px;flex:none;background:var(--log);padding:10px 16px;color:#6df58a;font:11px/1.5 Consolas,monospace;overflow:auto}.log-title{color:#98a8b6}.state-dump{color:#9eb5c8}

/* A — 顶部工作区 */
.a-workspace{background:#fff;border-bottom:1px solid var(--line);box-shadow:0 1px 6px rgba(31,42,55,.07)}.a-row{min-height:53px;padding:9px 18px;display:flex;align-items:center;gap:10px}.dataset-select{height:34px;min-width:230px;border:1px solid var(--strong);border-radius:6px;padding:0 9px;background:#fff;font-weight:650}.a-runtime{min-height:39px;padding:7px 18px;background:#f8faff;border-top:1px solid #e4eafa;display:flex;align-items:center;gap:9px;font-size:12px}.runtime-sep{color:#b1bac7}.server-strip{padding:7px 18px;display:flex;align-items:center;gap:10px;background:#fff;border-bottom:1px solid var(--line);font-size:12px}.endpoint{padding:5px 8px;border:1px solid var(--line);border-radius:5px;background:var(--soft)}

/* B — 数据集侧栏 */
.b-shell{flex:1;min-height:0;display:flex}.b-rail{width:282px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column}.b-logo{height:58px;padding:0 16px;display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--line)}.b-rail-title{padding:14px 14px 7px;font-size:10px;font-weight:800;color:#8992a0;letter-spacing:.08em}.dataset-card{margin:4px 9px;padding:11px;border:1px solid transparent;border-radius:7px}.dataset-card.active{background:#e8f0ff;border-color:#b8cdfd}.dataset-card .name{font-size:13px;font-weight:750}.dataset-card .meta{font-size:10px;color:var(--muted);margin-top:5px}.b-runtime-card{margin:auto 10px 10px;padding:12px;border:1px solid #c7d7fa;border-radius:8px;background:#f5f8ff;font-size:11px}.b-main{flex:1;min-width:0;display:flex;flex-direction:column}.b-top{height:58px;display:flex;align-items:center;gap:11px;padding:0 18px;background:#fff;border-bottom:1px solid var(--line)}.b-main .content{padding-top:10px}

/* C — 数据集中心 */
.c-top{height:56px;display:flex;align-items:center;gap:11px;padding:0 18px;background:#fff;border-bottom:1px solid var(--line)}.c-body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(480px,1.15fr) minmax(360px,.85fr);gap:12px;padding:12px}.c-library,.c-inspector{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:auto}.c-section-head{padding:15px 17px 11px;display:flex;align-items:center;gap:10px}.c-section-head h2{font-size:16px;margin:0}.search{height:32px;width:180px;border:1px solid var(--strong);border-radius:6px;padding:0 9px}.cards{display:grid;grid-template-columns:repeat(2,minmax(190px,1fr));gap:10px;padding:0 14px 14px}.scene-card{border:1px solid var(--line);border-radius:8px;padding:13px;background:#fff}.scene-card.selected{border:2px solid var(--brand);padding:12px}.scene-title{display:flex;align-items:start;justify-content:space-between;gap:8px;font-size:13px;font-weight:750}.scene-desc{font-size:11px;color:var(--muted);line-height:1.5;height:34px;margin:8px 0}.scene-meta{display:flex;gap:10px;font-size:10px;color:var(--muted)}.scene-actions{display:flex;gap:6px;margin-top:11px}.c-inspector{display:flex;flex-direction:column}.c-runtime{padding:15px;border-bottom:1px solid var(--line);background:#f8faff}.c-runtime h3{font-size:13px;margin:0 0 10px}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:11px}.step{padding:8px;border-radius:6px;background:#edf2fb;color:#4e5d71;font-size:10px;text-align:center}.step.done{background:#e5f6ee;color:var(--success)}.c-detail{padding:15px;overflow:auto}.c-detail h3{font-size:14px;margin:0 0 12px}.count-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.count-box{padding:12px;border:1px solid var(--line);border-radius:7px}.count-box strong{display:block;font-size:20px}.count-box span{font-size:10px;color:var(--muted)}

.switcher{position:fixed;z-index:100;bottom:14px;left:50%;transform:translateX(-50%);height:42px;display:flex;align-items:center;gap:4px;padding:4px;background:#17212c;color:#fff;border-radius:999px;box-shadow:0 10px 28px rgba(0,0,0,.28)}.switcher button{width:34px;height:34px;border:0;border-radius:50%;background:transparent;color:#fff;font-size:18px}.switcher button:hover{background:#344353}.variant-label{min-width:238px;text-align:center;font-size:12px;font-weight:750}.switcher small{color:#aebbc7;font-weight:500}.modal{position:fixed;z-index:90;inset:0;background:rgba(16,24,32,.48);display:flex;align-items:center;justify-content:center}.modal-card{width:min(720px,calc(100% - 30px));max-height:80vh;overflow:auto;background:#fff;border-radius:10px;box-shadow:0 18px 50px rgba(20,30,45,.28)}.modal-head{padding:17px 19px;border-bottom:1px solid var(--line);display:flex;align-items:center}.modal-head h3{font-size:16px;margin:0}.modal-body{padding:14px 19px}.dataset-table{width:100%;border-collapse:collapse;font-size:12px}.dataset-table th,.dataset-table td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}.dataset-table th{color:var(--muted);font-size:10px}.modal-foot{padding:12px 19px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line)}
@media(max-width:900px){.prototype-flag{display:none}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.b-rail{width:225px}.c-body{grid-template-columns:1fr}.c-inspector{display:none}.a-row{padding-right:10px}.a-row .brand{display:none}}
</style>
</head>
<body>
<div class="prototype-flag">THROWAWAY UI PROTOTYPE</div>
<main id="root"></main>

<div id="datasetModal" class="modal hidden" onclick="if(event.target===this)closeModal()">
  <section class="modal-card">
    <div class="modal-head"><h3>管理模拟数据集</h3><span class="grow"></span><button class="btn ghost" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <table class="dataset-table"><thead><tr><th>名称</th><th>ID</th><th>版本</th><th>SSH 命令</th><th>REST 路由</th><th>状态</th></tr></thead>
      <tbody><tr><td><strong>正常设备</strong></td><td class="mono">normal-device</td><td>Rev.5</td><td>12</td><td>36</td><td><span class="badge info">运行快照</span></td></tr>
      <tr><td><strong>设备存在严重告警</strong></td><td class="mono">critical-alarm</td><td>Rev.3</td><td>8</td><td>40</td><td><span class="badge neutral">可编辑</span></td></tr>
      <tr><td><strong>登录认证失败</strong></td><td class="mono">login-failed</td><td>Rev.2</td><td>3</td><td>10</td><td><span class="badge neutral">可编辑</span></td></tr></tbody></table>
    </div>
    <div class="modal-foot"><button class="btn">导入 JSON</button><button class="btn">导出</button><button class="btn">复制</button><button class="btn primary" onclick="closeModal()">＋ 新建数据集</button></div>
  </section>
</div>

<nav class="switcher" aria-label="原型方案切换">
  <button onclick="cycle(-1)" title="上一个方案">‹</button>
  <div id="variantLabel" class="variant-label"></div>
  <button onclick="cycle(1)" title="下一个方案">›</button>
</nav>

<script>
const variants={A:'顶部数据集工作区（推荐）',B:'左侧数据集导航',C:'独立数据集中心'};
const state={variant:'A',tab:'rest',selected:'critical-alarm',selectedName:'设备存在严重告警',selectedRev:3,active:'normal-device',activeName:'正常设备',activeRev:5,execution:'suite-10086-case-023',dirty:false,leased:true};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function init(){const q=new URLSearchParams(location.search).get('variant');state.variant=variants[q]?q:'A';render()}
function setVariant(v){state.variant=v;const u=new URL(location.href);u.searchParams.set('variant',v);history.replaceState({},'',u);render()}
function cycle(d){const keys=Object.keys(variants),i=keys.indexOf(state.variant);setVariant(keys[(i+d+keys.length)%keys.length])}
function setTab(tab){state.tab=tab;render()}
function toggleDirty(){state.dirty=!state.dirty;render()}
function save(){state.dirty=false;state.selectedRev++;render()}
function selectDataset(id){if(id==='normal-device'){state.selected=id;state.selectedName='正常设备';state.selectedRev=5}else if(id==='login-failed'){state.selected=id;state.selectedName='登录认证失败';state.selectedRev=2}else{state.selected='critical-alarm';state.selectedName='设备存在严重告警';state.selectedRev=3}state.dirty=false;render()}
function activate(){if(state.leased)return;state.active=state.selected;state.activeName=state.selectedName;state.activeRev=state.selectedRev;render()}
function openModal(){document.getElementById('datasetModal').classList.remove('hidden')}
function closeModal(){document.getElementById('datasetModal').classList.add('hidden')}
function headerTabs(){return `<div class="tabs"><button class="tab ${state.tab==='ssh'?'active':''}" onclick="setTab('ssh')">SSH Simulator</button><button class="tab ${state.tab==='rest'?'active':''}" onclick="setTab('rest')">REST Simulator</button></div>`}
function serverStrip(){return `<div class="server-strip"><strong>${state.tab==='ssh'?'SSH Server':'REST HTTPS Server'}</strong><span class="endpoint mono">${state.tab==='ssh'?'0.0.0.0:22':'0.0.0.0:443'}</span><span class="badge success">运行中</span><span class="grow"></span><button class="btn">停止服务</button><button class="btn">全局设置</button></div>`}
function editor(){const rest=state.tab==='rest';return `<div class="content"><aside class="list-panel"><div class="panel-title"><span>${rest?'REST 路由':'SSH 命令'}</span><span class="muted">${rest?'40':'8'}</span></div><div class="list"><div class="group">${rest?'REDFISH':'ALARM'}</div>${rest?'<div class="item active"><b>GET</b> /redfish/v1/SystemOverview</div><div class="item"><b>GET</b> /redfish/v1/Chassis</div><div class="item"><b>POST</b> /redfish/v1/Sessions</div>':'<div class="item active">show alarm</div><div class="item">show system general</div><div class="item">show health status</div>'}</div><div class="panel-actions"><button class="btn">＋ 新建</button><button class="btn">导入</button><button class="btn">删除</button></div></aside><section class="editor"><div class="editor-head"><h3>${rest?'REST 路由编辑器':'SSH 命令编辑器'}</h3><span class="badge ${state.dirty?'warn':'neutral'}">${state.dirty?'未保存':'已保存'}</span><span class="grow"></span><span class="muted" style="font-size:11px">${esc(state.selected)}@${state.selectedRev}</span></div>${rest?restForm():sshForm()}</section></div>`}
function restForm(){return `<div class="form-grid"><label class="field">HTTP 方法<select><option>GET</option></select></label><label class="field">URI<input value="/redfish/v1/SystemOverview"></label><label class="field">状态码<input value="200"></label><label class="field full">响应头<input value="Content-Type: application/json"></label><label class="field full">响应体<textarea>{\n  "CriticalAlarmCount": 1,\n  "MajorAlarmCount": 3,\n  "Health": "Warning"\n}</textarea></label></div><div class="hint">保存只更新数据集，不会影响当前运行快照。</div><div class="editor-actions"><button class="btn" onclick="toggleDirty()">编辑内容</button><button class="btn primary" onclick="save()">保存到数据集</button><button class="btn">测试路由</button></div>`}
function sshForm(){return `<div class="form-grid"><label class="field">用户名<input value="admin"></label><label class="field">密码<input type="password" value="admin123"></label><span></span><label class="field full">命令名称<input value="show alarm"></label><label class="field full">输出<textarea>Critical alarm detected\nAlarm ID: 0xA031\nSeverity: Critical</textarea></label></div><div class="hint">新的 SSH 连接使用已激活快照中的认证和命令数据。</div><div class="editor-actions"><button class="btn" onclick="toggleDirty()">编辑内容</button><button class="btn primary" onclick="save()">保存到数据集</button></div>`}
function runtimeLine(){const mismatch=state.selected!==state.active||state.selectedRev!==state.activeRev;return `<span class="badge info">执行器占用</span><strong>运行：${esc(state.activeName)} Rev.${state.activeRev}</strong><span class="runtime-sep">│</span><span class="mono">${esc(state.execution)}</span>${mismatch?'<span class="badge warn">编辑内容尚未激活</span>':''}`}
function log(){return `<div class="log"><span class="log-title">运行日志 · 数据集上下文已固定</span>\n[${esc(state.active)}@${state.activeRev}][${esc(state.execution)}] REST GET /redfish/v1/SystemOverview → 200\n<span class="state-dump">UI state: selected=${esc(state.selected)}@${state.selectedRev}, active=${esc(state.active)}@${state.activeRev}, lease=${state.leased?'executor':'idle'}</span></div>`}
function variantA(){return `<div class="app"><header class="a-workspace"><div class="a-row"><div class="brand">SmartKit Simulator</div><div class="divider"></div><span class="muted" style="font-size:11px">编辑数据集</span><select class="dataset-select" onchange="selectDataset(this.value)"><option value="critical-alarm" ${state.selected==='critical-alarm'?'selected':''}>设备存在严重告警</option><option value="normal-device" ${state.selected==='normal-device'?'selected':''}>正常设备</option><option value="login-failed" ${state.selected==='login-failed'?'selected':''}>登录认证失败</option></select><span class="badge ${state.dirty?'warn':'neutral'}">Rev.${state.selectedRev}${state.dirty?' · 未保存':''}</span><button class="btn" onclick="openModal()">管理数据集</button><span class="grow"></span><button class="btn primary" ${state.leased?'disabled':''} onclick="activate()">激活当前数据集</button></div><div class="a-runtime">${runtimeLine()}<span class="grow"></span><span class="muted">激活于 12:00:31</span></div></header>${headerTabs()}${serverStrip()}${editor()}${log()}</div>`}
function variantB(){return `<div class="app"><div class="b-shell"><aside class="b-rail"><div class="b-logo"><div class="brand">SmartKit Simulator</div></div><div class="b-rail-title">模拟数据集</div><div class="dataset-card ${state.selected==='normal-device'?'active':''}" onclick="selectDataset('normal-device')"><div class="name">正常设备</div><div class="meta">normal-device · Rev.5 · 12 / 36</div></div><div class="dataset-card ${state.selected==='critical-alarm'?'active':''}" onclick="selectDataset('critical-alarm')"><div class="name">设备存在严重告警</div><div class="meta">critical-alarm · Rev.3 · 8 / 40</div></div><div class="dataset-card ${state.selected==='login-failed'?'active':''}" onclick="selectDataset('login-failed')"><div class="name">登录认证失败</div><div class="meta">login-failed · Rev.2 · 3 / 10</div></div><div style="padding:8px 10px"><button class="btn primary" style="width:100%" onclick="openModal()">＋ 管理数据集</button></div><div class="b-runtime-card"><span class="badge info">执行器占用</span><p><b>${esc(state.activeName)} Rev.${state.activeRev}</b></p><div class="mono muted">${esc(state.execution)}</div></div></aside><section class="b-main"><div class="b-top"><strong>${esc(state.selectedName)}</strong><span class="badge ${state.dirty?'warn':'neutral'}">Rev.${state.selectedRev}${state.dirty?' · 未保存':''}</span><span class="grow"></span><span class="badge success">SSH :22</span><span class="badge success">REST :443</span><button class="btn">全局设置</button></div>${headerTabs()}${editor()}${log()}</section></div></div>`}
function sceneCard(id,name,rev,ssh,rest,desc,status=''){return `<article class="scene-card ${state.selected===id?'selected':''}" onclick="selectDataset('${id}')"><div class="scene-title"><span>${name}</span>${status?`<span class="badge info">${status}</span>`:''}</div><div class="scene-desc">${desc}</div><div class="scene-meta"><span>${ssh} SSH 命令</span><span>${rest} REST 路由</span><span>Rev.${rev}</span></div><div class="scene-actions"><button class="btn">打开</button><button class="btn">复制</button></div></article>`}
function variantC(){return `<div class="app"><header class="c-top"><div class="brand">SmartKit Simulator</div><button class="btn ghost">数据集中心</button><button class="btn ghost">SSH 编辑器</button><button class="btn ghost">REST 编辑器</button><span class="grow"></span><span class="badge success">服务运行中</span><button class="btn">全局设置</button></header><div class="c-body"><section class="c-library"><div class="c-section-head"><div><h2>模拟数据集</h2><span class="muted" style="font-size:11px">选择一个场景后再进入协议编辑器</span></div><span class="grow"></span><input class="search" placeholder="搜索数据集"><button class="btn primary" onclick="openModal()">＋ 新建</button></div><div class="cards">${sceneCard('normal-device','正常设备',5,12,36,'设备健康，无活动告警。','运行中')}${sceneCard('critical-alarm','设备存在严重告警',3,8,40,'用于验证严重告警发现和上报流程。')}${sceneCard('login-failed','登录认证失败',2,3,10,'模拟 SSH 与 Redfish 认证失败。')}${sceneCard('degraded-device','设备降级运行',4,10,32,'部分硬件故障，但管理面仍可访问。')}</div></section><aside class="c-inspector"><div class="c-runtime"><h3>当前执行快照</h3>${runtimeLine()}<div class="steps"><div class="step done">① 已激活</div><div class="step done">② 用例执行中</div><div class="step">③ 等待释放</div></div></div><div class="c-detail"><h3>${esc(state.selectedName)} <span class="badge neutral">Rev.${state.selectedRev}</span></h3><p class="muted" style="font-size:11px;line-height:1.55">用于验证设备在目标场景下的 SSH 命令输出和 REST API 响应。</p><div class="count-row"><div class="count-box"><strong>${state.selected==='critical-alarm'?8:12}</strong><span>SSH 命令</span></div><div class="count-box"><strong>${state.selected==='critical-alarm'?40:36}</strong><span>REST 路由</span></div></div><div class="editor-actions"><button class="btn">编辑 SSH</button><button class="btn">编辑 REST</button></div><div class="hint" style="margin-top:14px">运行中的是 ${esc(state.activeName)} Rev.${state.activeRev}。打开或保存其他数据集不会改变执行快照。</div></div></aside></div>${log()}</div>`}
function render(){document.getElementById('root').innerHTML=state.variant==='A'?variantA():state.variant==='B'?variantB():variantC();document.getElementById('variantLabel').innerHTML=`${state.variant} · ${variants[state.variant]} <small>← → 可切换</small>`}
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)});
init();
</script>
</body>
</html>
